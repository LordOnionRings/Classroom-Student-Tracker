/* ============ WRITING ASSESSMENT: data helpers ============ */
async function getWritingFeedbackRecord(assessmentId, studentId){
  const all = await dbGetAllByIndex('writingFeedback','assessmentId', assessmentId);
  return all.find(f=>f.studentId===studentId) || null;
}
async function getOrCreateWritingFeedbackRecord(assessmentId, classId, studentId){
  let rec = await getWritingFeedbackRecord(assessmentId, studentId);
  if(rec) return rec;
  // scores.criteria holds Eng Lit DP per-criterion scores (code -> 0..maxScore), keyed
  // independently of dp/myp/level so non-Lit assessments never touch it.
  rec = { id: uuid(), assessmentId, classId, studentId, comment:'', scores:{dp:null,myp:null,level:null,criteria:{}}, submittedAt:null, updatedAt: Date.now() };
  await dbAdd('writingFeedback', rec);
  return rec;
}
async function computeWritingTally(assessmentId, studentId){
  const events = (await dbGetAllByIndex('writingEvents','assessmentId', assessmentId)).filter(e=>e.studentId===studentId);
  const neg = {}, pos = {};
  events.forEach(e=>{
    const bucket = e.polarity==='positive' ? pos : neg;
    if(!bucket[e.skillKey]) bucket[e.skillKey] = { count:0, quotes:[] };
    bucket[e.skillKey].count++;
    if(e.quote) bucket[e.skillKey].quotes.push(e.quote);
  });
  return { neg, pos, events };
}
// Deleting an assessment removes it AND every writingEvents/writingFeedback record tied to
// it -- nothing orphaned is left behind on a student's record. This is deliberate: it's the
// same cascade-delete guarantee the app already gives for deleting a class, and it means a
// test/throwaway assessment can be fully wiped without polluting a student's longer-term data.
async function deleteWritingAssessmentCascade(assessmentId){
  const events = await dbGetAllByIndex('writingEvents','assessmentId', assessmentId);
  for(const e of events) await dbDelete('writingEvents', e.id);
  const feedback = await dbGetAllByIndex('writingFeedback','assessmentId', assessmentId);
  for(const f of feedback) await dbDelete('writingFeedback', f.id);
  await dbDelete('writingAssessments', assessmentId);
}
async function computeWritingStatus(assessmentId, studentId){
  const rec = await getWritingFeedbackRecord(assessmentId, studentId);
  if(rec && rec.submittedAt) return 'submitted';
  const events = (await dbGetAllByIndex('writingEvents','assessmentId', assessmentId)).filter(e=>e.studentId===studentId);
  const hasComment = rec && rec.comment && rec.comment.trim();
  // scores.dp/myp/level are checked directly (not via Object.values) because scores.criteria
  // is always a truthy object ({} when nothing scored yet) and would otherwise register as
  // "scored" the instant the feedback record is created.
  const hasScore = !!(rec && rec.scores && (
    rec.scores.dp!=null || rec.scores.myp!=null || rec.scores.level!=null ||
    (rec.scores.criteria && Object.values(rec.scores.criteria).some(v=>v!=null))
  ));
  if(events.length>0 || hasComment || hasScore) return 'in_progress';
  return 'unassessed';
}

/* ============ WRITING ASSESSMENT: data aggregation ============ */
function rankWritingSkills(bySkill, polarity){
  return Object.keys(bySkill)
    .map(key=>({ key, label: writingSkillLabel(polarity, key), count: bySkill[key] }))
    .sort((x,y)=> y.count - x.count || x.label.localeCompare(y.label));
}

// Aggregates one student's writing tags either across every assessment in the class
// (assessmentId omitted) or scoped to a single assessment. Used for both the Student Data
// overview and the per-assessment drill-down (same shape, different scope).
async function computeStudentWritingAggregate(classId, studentId, assessmentId){
  const allAssessments = (await dbGetAllByIndex('writingAssessments','classId', classId))
    .sort((a,b)=> (a.dueDate||'').localeCompare(b.dueDate||'') || a.createdAt - b.createdAt);
  const assessments = assessmentId ? allAssessments.filter(a=>a.id===assessmentId) : allAssessments;

  const posBySkill = {}, negBySkill = {};
  let posTotal = 0, negTotal = 0;
  const trend = [];

  for(const a of assessments){
    const events = (await dbGetAllByIndex('writingEvents','assessmentId', a.id)).filter(e=>e.studentId===studentId);
    let aPos = 0, aNeg = 0;
    events.forEach(e=>{
      if(e.polarity==='positive'){ posBySkill[e.skillKey]=(posBySkill[e.skillKey]||0)+1; posTotal++; aPos++; }
      else { negBySkill[e.skillKey]=(negBySkill[e.skillKey]||0)+1; negTotal++; aNeg++; }
    });
    trend.push({ assessmentId:a.id, title:a.title, dueDate:a.dueDate, posCount:aPos, negCount:aNeg });
  }

  const positiveRanked = rankWritingSkills(posBySkill, 'positive');
  const negativeRanked = rankWritingSkills(negBySkill, 'negative');
  return {
    posBySkill, negBySkill, posTotal, negTotal,
    positiveRanked, negativeRanked,
    topPositive: positiveRanked.slice(0,3),
    topNegative: negativeRanked.slice(0,3),
    trend
  };
}

// Same idea, but for the whole class: per-skill totals, a per-assessment trend using the
// class AVERAGE (since raw totals aren't comparable across assessments with different
// participation), and one point per student (positive count x, negative count y) for the
// outlier scatter plot -- scoped to all-time or a single assessment, same as the student version.
async function computeClassWritingAggregate(classId, assessmentId){
  const students = (await dbGetAllByIndex('students','classId', classId)).filter(s=>s.active!==false);
  const allAssessments = (await dbGetAllByIndex('writingAssessments','classId', classId))
    .sort((a,b)=> (a.dueDate||'').localeCompare(b.dueDate||'') || a.createdAt - b.createdAt);
  const assessments = assessmentId ? allAssessments.filter(a=>a.id===assessmentId) : allAssessments;

  const posBySkill = {}, negBySkill = {};
  let posTotal = 0, negTotal = 0;
  const trend = [];
  const perStudentTotals = {};
  students.forEach(s=> perStudentTotals[s.id] = { pos:0, neg:0 });

  for(const a of assessments){
    const events = await dbGetAllByIndex('writingEvents','assessmentId', a.id);
    let aPos = 0, aNeg = 0;
    events.forEach(e=>{
      if(!perStudentTotals.hasOwnProperty(e.studentId)) return; // student no longer active/on roster
      if(e.polarity==='positive'){ posBySkill[e.skillKey]=(posBySkill[e.skillKey]||0)+1; posTotal++; aPos++; perStudentTotals[e.studentId].pos++; }
      else { negBySkill[e.skillKey]=(negBySkill[e.skillKey]||0)+1; negTotal++; aNeg++; perStudentTotals[e.studentId].neg++; }
    });
    const denom = students.length || 1;
    trend.push({ assessmentId:a.id, title:a.title, dueDate:a.dueDate, avgPos: aPos/denom, avgNeg: aNeg/denom });
  }

  const positiveRanked = rankWritingSkills(posBySkill, 'positive');
  const negativeRanked = rankWritingSkills(negBySkill, 'negative');
  const scatterPoints = students
    .map(s=>({ studentId:s.id, name:s.name, firstName: s.name.split(' ')[0], posCount: perStudentTotals[s.id].pos, negCount: perStudentTotals[s.id].neg }))
    .filter(p=> p.posCount>0 || p.negCount>0);

  return {
    posBySkill, negBySkill, posTotal, negTotal,
    positiveRanked, negativeRanked,
    topPositive: positiveRanked.slice(0,3),
    topNegative: negativeRanked.slice(0,3),
    trend, scatterPoints
  };
}

/* ============ WRITING ASSESSMENT: rendering ============ */
function writingReportContentHtml(assessment, student, feedback, tally){
  if(hasCriteriaFlow(assessment)) return writingCriteriaReportContentHtml(assessment, student, feedback, tally);
  const renderBucket = (bucket, polarity) => {
    const keys = Object.keys(bucket);
    if(keys.length===0) return '<div class="muted">None logged.</div>';
    return keys.map(key=>{
      const t = bucket[key];
      const quotesHtml = t.quotes.length
        ? `<ul style="margin:4px 0 0 18px;">${t.quotes.map(q=>`<li>&ldquo;${escapeHtml(q)}&rdquo;</li>`).join('')}</ul>`
        : '';
      return `<div style="margin-bottom:8px;"><strong>${escapeHtml(writingSkillLabel(polarity, key, assessment))}</strong> <span class="muted">&times;${t.count}</span>${quotesHtml}</div>`;
    }).join('');
  };
  const scoreLines = [];
  if(feedback.scores){
    if(feedback.scores.dp != null) scoreLines.push(`DP Score: ${feedback.scores.dp} / 7`);
    if(feedback.scores.myp != null) scoreLines.push(`MYP Score: ${feedback.scores.myp} / 8`);
    if(feedback.scores.level) scoreLines.push(`Level: ${escapeHtml(feedback.scores.level)}`);
  }
  return `
    <h3>${escapeHtml(assessment.title)}</h3>
    <div class="muted" style="margin-bottom:10px;">${escapeHtml(student.name)} &middot; Due ${formatDateNice(assessment.dueDate)}</div>
    ${assessment.prompt ? `<div class="card" style="margin-bottom:14px;"><em>${escapeHtml(assessment.prompt)}</em></div>` : ''}
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div>
        <h4 style="color:var(--bad);">Areas for Improvement</h4>
        ${renderBucket(tally.neg, 'negative')}
      </div>
      <div>
        <h4 style="color:var(--good);">Writing Successes</h4>
        ${renderBucket(tally.pos, 'positive')}
      </div>
    </div>
    ${feedback.comment ? `<h4 style="margin-top:16px;">Comments</h4><p>${escapeHtml(feedback.comment)}</p>` : ''}
    ${scoreLines.length ? `<h4 style="margin-top:16px;">Score</h4><p>${scoreLines.join(' &middot; ')}</p>` : ''}
  `;
}

// Eng Lit DP report: one block per selected Criterion showing its score and the specific
// feedback taps (module + quote) tagged to that Criterion, split Strengths/Points for
// Improvement -- this is the auto-attribution Mike called "really key to making the project
// worth it": it shows the student WHY they got e.g. 2/5 instead of 3/5 on a given Criterion.
// Any tap that wasn't tagged to a Criterion still appears, in an "Untagged Feedback" section,
// so nothing logged is ever silently dropped from the report.
function writingCriteriaReportContentHtml(assessment, student, feedback, tally){
  const criteria = assessment.subjectMeta.criteria;
  const total = computeWritingCriteriaTotal(assessment, feedback);
  const taggedEventIds = new Set();

  const tapLineHtml = (e) => {
    const label = writingSkillLabel(e.polarity, e.skillKey, assessment);
    const quote = e.quote ? ` &mdash; &ldquo;${escapeHtml(e.quote)}&rdquo;` : '';
    return `<li><strong>${escapeHtml(label)}</strong>${quote}</li>`;
  };

  const criteriaBlocksHtml = criteria.map(c=>{
    const posTaps = tally.events.filter(e=>e.polarity==='positive' && e.criteriaCodes && e.criteriaCodes.includes(c.code));
    const negTaps = tally.events.filter(e=>e.polarity==='negative' && e.criteriaCodes && e.criteriaCodes.includes(c.code));
    posTaps.forEach(e=>taggedEventIds.add(e.id));
    negTaps.forEach(e=>taggedEventIds.add(e.id));
    const score = feedback.scores && feedback.scores.criteria ? feedback.scores.criteria[c.code] : null;
    const strandsHtml = c.strands && c.strands.length
      ? `<div class="muted" style="font-style:italic; margin-top:4px;">${c.strands.map(s=>escapeHtml(s.taskDescription ? `${s.text} -- ${s.taskDescription}` : s.text)).join('<br>')}</div>`
      : '';
    return `
      <div class="card" style="margin-bottom:10px;">
        <div class="row between"><strong>${escapeHtml(c.code)}: ${escapeHtml(c.label)}</strong><span>${score!=null ? `${score} / ${c.maxScore}` : `-- / ${c.maxScore}`}</span></div>
        ${strandsHtml}
        <div style="margin-top:8px;"><strong style="color:var(--good);">Strengths</strong>${posTaps.length ? `<ul style="margin:4px 0 0 18px;">${posTaps.map(tapLineHtml).join('')}</ul>` : '<div class="muted">None logged.</div>'}</div>
        <div style="margin-top:8px;"><strong style="color:var(--bad);">Points for Improvement</strong>${negTaps.length ? `<ul style="margin:4px 0 0 18px;">${negTaps.map(tapLineHtml).join('')}</ul>` : '<div class="muted">None logged.</div>'}</div>
      </div>`;
  }).join('');

  const untaggedEvents = tally.events.filter(e=> !taggedEventIds.has(e.id));
  const untaggedHtml = untaggedEvents.length
    ? `<div class="card" style="margin-top:10px;"><strong>Untagged Feedback</strong><ul style="margin:6px 0 0 18px;">${untaggedEvents.map(tapLineHtml).join('')}</ul></div>`
    : '';

  return `
    <h3>${escapeHtml(assessment.title)}</h3>
    <div class="muted" style="margin-bottom:4px;">${escapeHtml(student.name)} &middot; Due ${formatDateNice(assessment.dueDate)}</div>
    <div class="muted" style="margin-bottom:10px;">${escapeHtml(assessment.subject)}${writingAssessmentMetaLabel(assessment) ? ` &middot; ${writingAssessmentMetaLabel(assessment)}` : ''}</div>
    ${assessment.prompt ? `<div class="card" style="margin-bottom:14px;"><em>${escapeHtml(assessment.prompt)}</em></div>` : ''}
    <div style="margin-bottom:10px;"><strong>Total: ${total.total} / ${total.max}</strong>${total.complete?'':' <span class="muted">(not all criteria scored yet)</span>'}</div>
    ${criteriaBlocksHtml}
    ${untaggedHtml}
    ${feedback.comment ? `<h4 style="margin-top:16px;">Comments</h4><p>${escapeHtml(feedback.comment)}</p>` : ''}
  `;
}

async function renderWritingTab(){
  // NOTE: Data page (Stage 2) sub-nav is intentionally not wired into the UI yet.
  // The aggregation + rendering functions below (renderWritingDataView, etc.) are
  // built and ready, but paused per instruction while the subject/criteria/strand
  // architecture (Eng Lit DP) is designed and built first. Re-enable by restoring

function writingAggregateSummaryHtml(agg, scopeLabel){
  const posHtml = agg.topPositive.length
    ? agg.topPositive.map((x,i)=>`<div style="margin-bottom:4px;">${i+1}. ${escapeHtml(x.label)} <span class="muted">&times;${x.count}</span></div>`).join('')
    : `<div class="muted">No data yet.</div>`;
  const negHtml = agg.topNegative.length
    ? agg.topNegative.map((x,i)=>`<div style="margin-bottom:4px;">${i+1}. ${escapeHtml(x.label)} <span class="muted">&times;${x.count}</span></div>`).join('')
    : `<div class="muted">No data yet.</div>`;
  return `
    <div class="grid-cards">
      <div class="card">
        <div class="row between"><strong>Top 3 Writing Successes</strong><span class="tag positive">${escapeHtml(scopeLabel)}</span></div>
        <div style="margin-top:8px;">${posHtml}</div>
      </div>
      <div class="card">
        <div class="row between"><strong>Bottom 3 Writing Challenges</strong><span class="tag negative">${escapeHtml(scopeLabel)}</span></div>
        <div style="margin-top:8px;">${negHtml}</div>
      </div>
    </div>`;
}

  const students = (await dbGetAllByIndex('students','classId', state.currentClassId))
    .filter(s=>s.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  if(students.length===0) return `<div class="empty">No students yet.</div>`;
  if(!state.writingDataSelectedStudentId || !students.find(s=>s.id===state.writingDataSelectedStudentId)){
    state.writingDataSelectedStudentId = students[0].id;
  }
  const selectHtml = `<select id="writing-data-student-select" style="max-width:280px; margin-bottom:14px;">
    ${students.map(s=>`<option value="${s.id}" ${s.id===state.writingDataSelectedStudentId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
  </select>`;

  const assessments = (await dbGetAllByIndex('writingAssessments','classId', state.currentClassId))
    .sort((a,b)=> (a.dueDate||'').localeCompare(b.dueDate||''));

  if(state.writingDataSelectedAssessmentId && !assessments.find(a=>a.id===state.writingDataSelectedAssessmentId)){
    state.writingDataSelectedAssessmentId = null;
  }

  if(state.writingDataSelectedAssessmentId){
    const a = assessments.find(x=>x.id===state.writingDataSelectedAssessmentId);

    return `
      ${selectHtml}
      <div class="row between" style="margin-bottom:10px;">
        <button class="btn ghost" id="writing-data-back-to-overview">&larr; All Assessments Overview</button>
        <strong>${escapeHtml(a ? a.title : '')}</strong>
      </div>
      ${writingAggregateSummaryHtml(agg, 'This Assessment')}
      <div class="grid-cards" style="margin-top:14px;">
        <div class="card"><canvas id="writing-student-pos-pie"></canvas></div>
        <div class="card"><canvas id="writing-student-neg-pie"></canvas></div>
      </div>
    `;
  }

  const agg = await computeStudentWritingAggregate(state.currentClassId, state.writingDataSelectedStudentId, null);
  const assessmentListHtml = assessments.length
    ? assessments.map(a=>`<div class="card clickable" data-writing-data-open-assessment="${a.id}"><strong>${escapeHtml(a.title)}</strong> <span class="muted">&middot; Due ${formatDateNice(a.dueDate)}</span></div>`).join('')
    : `<div class="empty">No assessments logged yet.</div>`;

    ${selectHtml}

async function renderWritingAssessmentList(){
  const assessments = (await dbGetAllByIndex('writingAssessments','classId', state.currentClassId))
    .sort((a,b)=> b.createdAt - a.createdAt);
  const addBtn = `<button class="btn primary" id="add-writing-assessment-btn">+ Add Writing Assessment</button>`;
  if(assessments.length===0){
    return `<div class="empty">No writing assessments yet for this class.</div><div class="row" style="margin-top:12px;">${addBtn}</div>`;
  }
  const students = (await dbGetAllByIndex('students','classId', state.currentClassId)).filter(s=>s.active!==false);
  const cardsHtml = [];
  for(const a of assessments){
    let submitted = 0;
    for(const s of students){
      if(await computeWritingStatus(a.id, s.id) === 'submitted') submitted++;
    }
    const pct = students.length ? Math.round(100*submitted/students.length) : 0;
    cardsHtml.push(`
      <div class="card clickable" data-open-assessment="${a.id}">
        <div class="row between">
          <strong>${escapeHtml(a.title)}</strong>
          <span class="tag neutral">${a.type==='summative'?'Summative':'Formative'}</span>
        </div>
        <div class="muted" style="margin-top:4px;">
          ${a.subject ? `${escapeHtml(a.subject)}${writingAssessmentMetaLabel(a) ? ` &middot; ${writingAssessmentMetaLabel(a)}` : ''} &middot; ` : ''}Due ${formatDateNice(a.dueDate)} &middot; ${submitted}/${students.length} complete (${pct}%)
        </div>
      </div>`);
  }
  return `<div class="row" style="margin-bottom:14px;">${addBtn}</div><div class="grid-cards">${cardsHtml.join('')}</div>`;
}

async function renderWritingAssessmentDetail(assessmentId){
  const assessment = await dbGet('writingAssessments', assessmentId);
  // Defensive check: an assessment ID left over from a different class (e.g. a stale
  // selection) must never render here -- a writing assessment belongs to exactly one class.
  if(!assessment || assessment.classId !== state.currentClassId){
    state.writingView = 'list'; state.writingSelectedAssessmentId = null;
    return await renderWritingAssessmentList();
  }
  const students = (await dbGetAllByIndex('students','classId', state.currentClassId))
    .filter(s=>s.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  const statusMeta = {
    unassessed:{label:'Unassessed', cls:'negative'},
    in_progress:{label:'In Progress', cls:'warn'},
    submitted:{label:'Feedback Complete', cls:'positive'}
  };
  const rows = [];
  let submittedCount = 0;
  for(const s of students){
    const status = await computeWritingStatus(assessmentId, s.id);
    if(status==='submitted') submittedCount++;
    const meta = statusMeta[status];
    rows.push(`
      <div class="card row between" data-open-student="${s.id}" style="cursor:pointer;">
        <span>${escapeHtml(s.name)}</span>
        <div class="row">
          <span class="tag ${meta.cls}">${meta.label}</span>
          ${status==='submitted' ? `<button class="btn small ghost" data-view-report="${s.id}">View Report</button>` : ''}
        </div>
      </div>`);
  }
  const pct = students.length ? Math.round(100*submittedCount/students.length) : 0;
  return `
    <div class="row between wrap" style="margin-bottom:10px;">
      <button class="btn ghost" id="back-to-writing-list">&larr; All Assessments</button>
      <div class="row wrap">
        <button class="btn small" id="export-all-writing-btn">Export All Reports (PDF)</button>
        <button class="btn small danger" id="delete-writing-assessment-btn">Delete Assessment</button>
      </div>
    </div>
    <h3>${escapeHtml(assessment.title)}</h3>
    <div class="muted" style="margin-bottom:14px;">
      ${assessment.subject ? `${escapeHtml(assessment.subject)}${writingAssessmentMetaLabel(assessment) ? ` &middot; ${writingAssessmentMetaLabel(assessment)}` : ''} &middot; ` : ''}${assessment.type==='summative'?'Summative':'Formative'} &middot; ${assessment.mode==='in_class_timed'?'In-Class Timed':'Take Home'} &middot; Due ${formatDateNice(assessment.dueDate)} &middot; ${submittedCount}/${students.length} complete (${pct}%)
    </div>
    ${rows.join('')}
  `;
}

async function renderWritingStudentPage(assessmentId, studentId){
  const assessment = await dbGet('writingAssessments', assessmentId);
  const student = await dbGet('students', studentId);
  // Same defensive check as the detail page: both the assessment AND the student must
  // actually belong to the class currently open, or we bounce back rather than render
  // data that belongs to a different class.
  if(!assessment || assessment.classId !== state.currentClassId || !student || student.classId !== state.currentClassId){
    state.writingView = 'detail'; state.writingSelectedStudentId = null;
    return await renderWritingAssessmentDetail(assessmentId);
  }
  const feedback = await getOrCreateWritingFeedbackRecord(assessmentId, state.currentClassId, studentId);
  const tally = await computeWritingTally(assessmentId, studentId);
  const mode = state.writingStudentMode || (feedback.submittedAt ? 'report' : 'edit');
  const backBtn = `<button class="btn ghost" id="back-to-writing-detail">&larr; ${escapeHtml(assessment.title)}</button>`;

  if(mode==='report' || mode==='review'){
    const actionsHtml = mode==='report'
      ? `<div class="row" style="margin-top:16px;">
           <button class="btn small" id="wa-edit-feedback-btn">Edit Feedback</button>
           <button class="btn small ghost" id="wa-export-report-btn">Export PDF</button>
         </div>`
      : `<div class="row" style="margin-top:16px;">
           <button class="btn ghost" id="wa-back-to-edit-btn">&larr; Go Back and Edit</button>
           <button class="btn primary" id="wa-submit-feedback-btn">${feedback.submittedAt ? 'Save Changes' : 'Submit Feedback'}</button>
         </div>`;
    return `${backBtn}<div class="card" style="margin-top:10px;">${writingReportContentHtml(assessment, student, feedback, tally)}</div>${actionsHtml}`;
  }

  const hasCriteria = hasCriteriaFlow(assessment);
  const negSkills = writingNegSkillsForAssessment(assessment);
  const posSkills = writingPosSkillsForAssessment(assessment);
  const skillButtonHtml = (skill, polarity) => {
    const bucket = polarity==='negative' ? tally.neg : tally.pos;
    const t = bucket[skill.key];
    const count = t ? t.count : 0;
    // For Criteria assessments (Eng Lit DP, I&S MYP), tapping a feedback module opens a modal
    // (quote + which Criteria this tap applies to) instead of the plain quote-only prompt used
    // by every other subject.
    return `
      <div class="cat-btn" style="cursor:pointer;" data-wa-skill="${skill.key}" data-wa-polarity="${polarity}" ${hasCriteria?'data-wa-criteria-tag="1"':''}>
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span>${escapeHtml(skill.label)}</span>
          <span class="row" style="gap:8px;">
            ${count ? `<span class="event-badge" style="position:static;">${count}</span>` : ''}
            ${count ? `<span class="btn ghost" style="padding:2px 8px; font-size:12px;" data-wa-manage="${skill.key}" data-wa-manage-polarity="${polarity}">Manage</span>` : ''}
          </span>
        </div>
        ${skill.description ? `<div class="muted" style="font-style:italic; font-weight:400; margin-top:4px;">${escapeHtml(skill.description)}</div>` : ''}
      </div>`;
  };

  const scoreSectionsHtml = [];
  if(hasCriteria){
    const total = computeWritingCriteriaTotal(assessment, feedback);
    assessment.subjectMeta.criteria.forEach(c=>{
      const current = feedback.scores.criteria ? feedback.scores.criteria[c.code] : null;
      const options = []; for(let n=0;n<=c.maxScore;n++) options.push(n);
      scoreSectionsHtml.push(`
        <div class="field">
          <label>${escapeHtml(c.code)}: ${escapeHtml(c.label)} (out of ${c.maxScore})</label>
          <div>${options.map(n=>`<span class="chip ${current===n?'selected':''}" data-wa-criteria-score="${escapeHtml(c.code)}" data-wa-value="${n}">${n}</span>`).join('')}</div>
        </div>`);
    });
    scoreSectionsHtml.push(`<div class="muted" style="margin-top:4px;">Total: ${total.total} / ${total.max}${total.complete?'':' (not all criteria scored yet)'}</div>`);
  } else {
    if(assessment.methods.includes('dp_scale')){
      scoreSectionsHtml.push(`
        <div class="field">
          <label>DP Score (1-7)</label>
          <div>${[1,2,3,4,5,6,7].map(n=>`<span class="chip ${feedback.scores.dp===n?'selected':''}" data-wa-score="dp" data-wa-value="${n}">${n}</span>`).join('')}</div>
        </div>`);
    }
    if(assessment.methods.includes('myp_scale')){
      scoreSectionsHtml.push(`
        <div class="field">
          <label>MYP Score (1-8)</label>
          <div>${[1,2,3,4,5,6,7,8].map(n=>`<span class="chip ${feedback.scores.myp===n?'selected':''}" data-wa-score="myp" data-wa-value="${n}">${n}</span>`).join('')}</div>
        </div>`);
    }
    if(assessment.methods.includes('be_ae_me_ee')){
      scoreSectionsHtml.push(`
        <div class="field">
          <label>Level</label>
          <div>${['BE','AE','ME','EE'].map(l=>`<span class="chip ${feedback.scores.level===l?'selected':''}" data-wa-score="level" data-wa-value="${l}">${l}</span>`).join('')}</div>
        </div>`);
    }
  }

  return `
    ${backBtn}
    <h3 style="margin-top:10px;">${escapeHtml(student.name)}</h3>
    <div class="muted" style="margin-bottom:14px;">${escapeHtml(assessment.title)} &middot; Due ${formatDateNice(assessment.dueDate)}</div>
    ${assessment.prompt ? `<div class="card"><em>${escapeHtml(assessment.prompt)}</em></div>` : ''}
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:14px;">
      <div>
        <h4 style="color:var(--bad);">Areas for Improvement</h4>
        ${negSkills.map(s=>skillButtonHtml(s,'negative')).join('')}
      </div>
      <div>
        <h4 style="color:var(--good);">Writing Successes</h4>
        ${posSkills.map(s=>skillButtonHtml(s,'positive')).join('')}
      </div>
    </div>
    <div class="field" style="margin-top:16px;">
      <label>Comments (optional)</label>
      <textarea id="wa-comment-input" placeholder="Summarize the issues or highlights...">${escapeHtml(feedback.comment||'')}</textarea>
    </div>
    ${scoreSectionsHtml.join('')}
    <button class="btn primary block" id="wa-review-btn" style="margin-top:10px;">Review</button>
  `;
}

/* ============ WRITING ASSESSMENT: wizard ============ */
async function openWritingAssessmentWizard(){
  const draft = {
    subject: null, litPaper: null, litLevel: null, mypYear: null,
    title:'', type:'formative', mode:'in_class_timed', dueDate: todayStr(),
    writingType: WRITING_TYPES[0], writingTypeOther:'', litWritingTypeText:'', methods:[], prompt:'', promptNA:false,
    criteria: null // lazily built from LIT_CRITERIA_PAPER1/2 or IS_CRITERIA_YEARx once known
  };
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'wa-wizard-backdrop';
  const isLit = ()=> draft.subject === 'Eng Lit DP';
  const isIS = ()=> draft.subject === 'Individuals and Societies MYP';

  function syncFormValues(){
    const titleEl = backdrop.querySelector('#wa-title'); if(titleEl) draft.title = titleEl.value;
    const dueEl = backdrop.querySelector('#wa-due-date'); if(dueEl) draft.dueDate = dueEl.value;
    const otherEl = backdrop.querySelector('#wa-writing-type-other'); if(otherEl) draft.writingTypeOther = otherEl.value;
    const litTypeEl = backdrop.querySelector('#wa-lit-writing-type'); if(litTypeEl) draft.litWritingTypeText = litTypeEl.value;
    const promptEl = backdrop.querySelector('#wa-prompt'); if(promptEl && !draft.promptNA) draft.prompt = promptEl.value;
  }

  function ensureLitCriteria(){
    if(!draft.criteria){
      draft.criteria = litCriteriaForPaper(draft.litPaper).map(c=>({
        code:c.code, label:c.label, groupLabel:c.groupLabel||null, selected:true,
        strands: c.strands.map(text=>({ text, selected:true, taskDescription:'', descOpen:false }))
      }));
    }
  }
  function ensureISCriteria(){
    if(!draft.criteria){
      draft.criteria = isCriteriaForMypYear(draft.mypYear).map(c=>({
        code:c.code, label:c.label, groupLabel:null, selected:true,
        strands: c.strands.map(text=>({ text, selected:true, taskDescription:'', descOpen:false }))
      }));
    }
  }
  // Dispatches to whichever Criteria-flow subject is active. Any future criteria-based subject
  // just needs a branch here plus its own render*Step -- the shared Criteria/Strand steps below
  // (renderCriteriaStep/renderStrandsStep) already operate generically on draft.criteria.
  function ensureCriteria(){
    if(isLit()) ensureLitCriteria();
    else if(isIS()) ensureISCriteria();
  }

  /* ---- Step 0: Subject ---- */
  function renderSubjectStep(){
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Add Writing Assessment</h3>
          <button class="icon-btn" id="close-wa-wizard">&times;</button>
        </div>
        <div class="field">
          <label>Which subject is this for?</label>
          <div>${SUBJECTS.map(s=>`<span class="chip ${draft.subject===s?'selected':''}" data-wa-subject="${escapeHtml(s)}">${escapeHtml(s)}</span>`).join('')}</div>
        </div>
        <button class="btn primary block" id="wa-subject-next-btn">Next</button>
      </div>
    `;
    backdrop.querySelector('#close-wa-wizard').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelectorAll('[data-wa-subject]').forEach(el=>{
      el.addEventListener('click', ()=>{
        draft.subject = el.getAttribute('data-wa-subject');
        renderSubjectStep();
      });
    });
    backdrop.querySelector('#wa-subject-next-btn').addEventListener('click', ()=>{
      if(!draft.subject){ toast('Please choose a subject'); return; }
      if(isLit()) renderLitPaperLevelStep();
      else if(isIS()) renderISYearStep();
      else renderForm();
    });
  }

  /* ---- Step 0b (I&S MYP only): MYP Year band (decides strand wording) ---- */
  function renderISYearStep(){
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Individuals and Societies MYP</h3>
          <button class="icon-btn" id="close-wa-wizard">&times;</button>
        </div>
        <div class="field">
          <label>MYP Year</label>
          <div>${IS_MYP_YEARS.map(y=>`<span class="chip ${draft.mypYear===y?'selected':''}" data-wa-is-year="${escapeHtml(y)}">${escapeHtml(y)}</span>`).join('')}</div>
          <div class="muted" style="margin-top:6px;">Sets the official IB strand wording for the criteria step.</div>
        </div>
        <div class="row" style="margin-top:14px;">
          <button class="btn ghost" id="wa-is-back-btn">&larr; Back</button>
          <button class="btn primary" id="wa-is-next-btn">Next</button>
        </div>
      </div>
    `;
    backdrop.querySelector('#close-wa-wizard').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelectorAll('[data-wa-is-year]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const y = el.getAttribute('data-wa-is-year');
        if(draft.mypYear !== y) draft.criteria = null; // year changed -- rebuild criteria list when we get there
        draft.mypYear = y;
        renderISYearStep();
      });
    });
    backdrop.querySelector('#wa-is-back-btn').addEventListener('click', ()=> renderSubjectStep());
    backdrop.querySelector('#wa-is-next-btn').addEventListener('click', ()=>{
      if(!draft.mypYear){ toast('Please choose a MYP Year'); return; }
      if(!IS_WRITING_TYPES.includes(draft.writingType)) draft.writingType = IS_WRITING_TYPES[0];
      renderForm();
    });
  }

  /* ---- Step 0b (Eng Lit DP only): Paper + Level ---- */
  function renderLitPaperLevelStep(){
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Eng Lit DP</h3>
          <button class="icon-btn" id="close-wa-wizard">&times;</button>
        </div>
        <div class="field">
          <label>Paper</label>
          <div>
            <span class="chip ${draft.litPaper==='paper1'?'selected':''}" data-wa-lit-paper="paper1">Paper 1</span>
            <span class="chip ${draft.litPaper==='paper2'?'selected':''}" data-wa-lit-paper="paper2">Paper 2</span>
          </div>
        </div>
        <div class="field">
          <label>Level</label>
          <div>
            <span class="chip ${draft.litLevel==='SL'?'selected':''}" data-wa-lit-level="SL">SL</span>
            <span class="chip ${draft.litLevel==='HL'?'selected':''}" data-wa-lit-level="HL">HL</span>
          </div>
        </div>
        <div class="row" style="margin-top:14px;">
          <button class="btn ghost" id="wa-lit-back-btn">&larr; Back</button>
          <button class="btn primary" id="wa-lit-next-btn">Next</button>
        </div>
      </div>
    `;
    backdrop.querySelector('#close-wa-wizard').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelectorAll('[data-wa-lit-paper]').forEach(el=>{
      el.addEventListener('click', ()=>{
        draft.litPaper = el.getAttribute('data-wa-lit-paper');
        draft.criteria = null; // paper changed -- rebuild criteria list when we get there
        renderLitPaperLevelStep();
      });
    });
    backdrop.querySelectorAll('[data-wa-lit-level]').forEach(el=>{
      el.addEventListener('click', ()=>{
        draft.litLevel = el.getAttribute('data-wa-lit-level');
        renderLitPaperLevelStep();
      });
    });
    backdrop.querySelector('#wa-lit-back-btn').addEventListener('click', ()=> renderSubjectStep());
    backdrop.querySelector('#wa-lit-next-btn').addEventListener('click', ()=>{
      if(!draft.litPaper){ toast('Please choose Paper 1 or Paper 2'); return; }
      if(!draft.litLevel){ toast('Please choose SL or HL'); return; }
      renderForm();
    });
  }

  /* ---- Step 1: existing fields (Writing Type becomes free text for Lit; methods hidden for Lit) ---- */
  function renderForm(){
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Add Writing Assessment</h3>
          <button class="icon-btn" id="close-wa-wizard">&times;</button>
        </div>
        <div class="muted" style="margin-bottom:10px;">${escapeHtml(draft.subject)}${isLit() ? ` &middot; ${draft.litPaper==='paper2'?'Paper 2':'Paper 1'} &middot; ${escapeHtml(draft.litLevel)}` : ''}${isIS() ? ` &middot; ${escapeHtml(draft.mypYear)}` : ''}</div>
        <div class="field">
          <label>Title</label>
          <input type="text" id="wa-title" placeholder="e.g. Unseen Poetry Analysis" value="${escapeHtml(draft.title)}">
        </div>
        <div class="field">
          <label>Type</label>
          <div>
            <span class="chip ${draft.type==='formative'?'selected':''}" data-wa-field="type" data-wa-val="formative">Formative</span>
            <span class="chip ${draft.type==='summative'?'selected':''}" data-wa-field="type" data-wa-val="summative">Summative</span>
          </div>
        </div>
        <div class="field">
          <label>Format</label>
          <div>
            <span class="chip ${draft.mode==='in_class_timed'?'selected':''}" data-wa-field="mode" data-wa-val="in_class_timed">In-Class Timed</span>
            <span class="chip ${draft.mode==='take_home'?'selected':''}" data-wa-field="mode" data-wa-val="take_home">Take Home</span>
          </div>
        </div>
        <div class="field">
          <label>Due Date</label>
          <input type="date" id="wa-due-date" value="${draft.dueDate}">
        </div>
        ${isLit() ? `
        <div class="field">
          <label>Writing Type</label>
          <input type="text" id="wa-lit-writing-type" placeholder="Describe the writing type" value="${escapeHtml(draft.litWritingTypeText)}">
        </div>` : isIS() ? `
        <div class="field">
          <label>Writing Type</label>
          <div>${IS_WRITING_TYPES.map(t=>`<span class="chip ${draft.writingType===t?'selected':''}" data-wa-field="writingType" data-wa-val="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('')}</div>
        </div>` : `
        <div class="field">
          <label>Writing Type</label>
          <div>${WRITING_TYPES.map(t=>`<span class="chip ${draft.writingType===t?'selected':''}" data-wa-field="writingType" data-wa-val="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('')}</div>
          ${draft.writingType==='Other' ? `<input type="text" id="wa-writing-type-other" placeholder="Describe the writing type" value="${escapeHtml(draft.writingTypeOther)}" style="margin-top:8px;">` : ''}
        </div>
        <div class="field">
          <label>How will it be assessed? (select all that apply)</label>
          <div>${WRITING_ASSESSMENT_METHODS.map(m=>`<span class="chip ${draft.methods.includes(m.key)?'selected':''}" data-wa-method="${m.key}">${escapeHtml(m.label)}</span>`).join('')}</div>
        </div>`}
        <div class="field">
          <label>${(isLit()||isIS()) ? 'Describe the Task' : 'Essay Prompt / Question'}</label>
          <textarea id="wa-prompt" placeholder="${(isLit()||isIS()) ? 'Describe the task in a clear and relevant way...' : 'Paste or type the prompt...'}" ${draft.promptNA?'disabled':''}>${draft.promptNA ? '' : escapeHtml(draft.prompt)}</textarea>
          <div style="margin-top:6px;"><span class="chip ${draft.promptNA?'selected':''}" id="wa-prompt-na">Not Applicable</span></div>
        </div>
        <div class="row" style="margin-top:14px;">
          <button class="btn ghost" id="wa-form-back-btn">&larr; Back</button>
          <button class="btn primary" id="wa-to-preview-btn">Preview</button>
        </div>
      </div>
    `;
    backdrop.querySelector('#close-wa-wizard').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelectorAll('[data-wa-field]').forEach(el=>{
      el.addEventListener('click', ()=>{
        syncFormValues();
        draft[el.getAttribute('data-wa-field')] = el.getAttribute('data-wa-val');
        renderForm();
      });
    });
    backdrop.querySelectorAll('[data-wa-method]').forEach(el=>{
      el.addEventListener('click', ()=>{
        syncFormValues();
        const key = el.getAttribute('data-wa-method');
        const idx = draft.methods.indexOf(key);
        if(idx===-1) draft.methods.push(key); else draft.methods.splice(idx,1);
        renderForm();
      });
    });
    const naChip = backdrop.querySelector('#wa-prompt-na');
    if(naChip) naChip.addEventListener('click', ()=>{
      syncFormValues();
      draft.promptNA = !draft.promptNA;
      renderForm();
    });
    backdrop.querySelector('#wa-form-back-btn').addEventListener('click', ()=>{
      syncFormValues();
      if(isLit()) renderLitPaperLevelStep();
      else if(isIS()) renderISYearStep();
      else renderSubjectStep();
    });
    backdrop.querySelector('#wa-to-preview-btn').addEventListener('click', ()=>{
      syncFormValues();
      if(!draft.title.trim()){ toast('Please enter a title'); return; }
      if(isLit()){
        if(!draft.litWritingTypeText.trim()){ toast('Please describe the writing type'); return; }
      } else if(!isIS() && draft.writingType==='Other' && !draft.writingTypeOther.trim()){
        toast('Please describe the writing type'); return;
      }
      renderPreview();
    });
  }

  /* ---- Step 2: Preview ---- */
  function renderPreview(){
    const finalWritingType = isLit() ? draft.litWritingTypeText.trim() : (draft.writingType==='Other' ? draft.writingTypeOther.trim() : draft.writingType);
    const methodsLabel = draft.methods.length
      ? draft.methods.map(k=> (WRITING_ASSESSMENT_METHODS.find(m=>m.key===k)||{}).label).join(', ')
      : 'None selected';
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Preview</h3>
          <button class="icon-btn" id="close-wa-wizard2">&times;</button>
        </div>
        <div class="card">
          <div class="muted">${escapeHtml(draft.subject)}${isLit() ? ` &middot; ${draft.litPaper==='paper2'?'Paper 2':'Paper 1'} &middot; ${escapeHtml(draft.litLevel)}` : ''}${isIS() ? ` &middot; ${escapeHtml(draft.mypYear)}` : ''}</div>
          <div style="margin-top:4px;"><strong>${escapeHtml(draft.title)}</strong></div>
          <div class="muted" style="margin-top:4px;">${draft.type==='summative'?'Summative':'Formative'} &middot; ${draft.mode==='in_class_timed'?'In-Class Timed':'Take Home'} &middot; Due ${formatDateNice(draft.dueDate)}</div>
          <div style="margin-top:8px;"><strong>Writing Type:</strong> ${escapeHtml(finalWritingType)}</div>
          ${(isLit()||isIS()) ? '' : `<div style="margin-top:8px;"><strong>Assessed via:</strong> ${escapeHtml(methodsLabel)}</div>`}
          <div style="margin-top:8px;"><strong>${(isLit()||isIS())?'Task Prompt':'Prompt'}:</strong> ${draft.promptNA ? 'Not Applicable' : (draft.prompt.trim() ? escapeHtml(draft.prompt) : '<span class="muted">(none entered)</span>')}</div>
        </div>
        <div class="row" style="margin-top:14px;">
          <button class="btn ghost" id="wa-back-to-form-btn">&larr; Edit</button>
          ${(isLit()||isIS())
            ? `<button class="btn primary" id="wa-to-criteria-btn">Submit and Select Criteria / Strands</button>`
            : `<button class="btn primary" id="wa-confirm-btn">Confirm</button>`}
        </div>
      </div>
    `;
    backdrop.querySelector('#close-wa-wizard2').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelector('#wa-back-to-form-btn').addEventListener('click', ()=> renderForm());

    function buildBaseAssessment(){
      return {
        id: uuid(), classId: state.currentClassId, title: draft.title.trim(),
        type: draft.type, mode: draft.mode, dueDate: draft.dueDate,
        subject: draft.subject,
        writingType: finalWritingType, methods: (isLit()||isIS()) ? [] : draft.methods.slice(),
        prompt: draft.promptNA ? null : (draft.prompt.trim() || null),
        createdAt: Date.now(), subjectMeta: null
      };
    }

    const confirmBtn = backdrop.querySelector('#wa-confirm-btn');
    if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
      const assessment = buildBaseAssessment();
      await dbAdd('writingAssessments', assessment);
      backdrop.remove();
      state.writingSelectedAssessmentId = assessment.id;
      state.writingView = 'detail';
      toast('Assessment created', 'good');
      render();
    });

    const criteriaBtn = backdrop.querySelector('#wa-to-criteria-btn');
    if(criteriaBtn) criteriaBtn.addEventListener('click', ()=>{
      draft.pendingAssessment = buildBaseAssessment();
      ensureCriteria();
      renderCriteriaStep();
    });
  }

  /* ---- Step 3 (Eng Lit DP only): select which Criteria apply ---- */
  function renderCriteriaStep(){
    const groups = [];
    const seenGroups = {};
    draft.criteria.forEach(c=>{
      if(c.groupLabel){
        if(!seenGroups[c.groupLabel]){ seenGroups[c.groupLabel] = { groupLabel:c.groupLabel, items:[] }; groups.push(seenGroups[c.groupLabel]); }
        seenGroups[c.groupLabel].items.push(c);
      } else {
        groups.push({ groupLabel:null, items:[c] });
      }
    });
    const rowsHtml = groups.map(g=>`
      ${g.groupLabel ? `<div class="muted" style="margin-top:10px;"><strong>${escapeHtml(g.groupLabel)}</strong></div>` : ''}
      ${g.items.map(c=>`
        <label class="card row between" style="cursor:pointer; margin-top:6px;">
          <span>${escapeHtml(c.code)}: ${escapeHtml(c.label)}</span>
          <input type="checkbox" data-wa-criterion="${escapeHtml(c.code)}" ${c.selected?'checked':''}>
        </label>`).join('')}
    `).join('');
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Select Criteria</h3>
          <button class="icon-btn" id="close-wa-wizard">&times;</button>
        </div>
        <div class="row" style="margin-bottom:8px;">
          <button class="btn small ghost" id="wa-criteria-select-all">Select All</button>
          <button class="btn small ghost" id="wa-criteria-select-none">Select None</button>
        </div>
        ${rowsHtml}
        <div class="row" style="margin-top:14px;">
          <button class="btn ghost" id="wa-criteria-back-btn">&larr; Back</button>
          <button class="btn primary" id="wa-criteria-next-btn">Next</button>
        </div>
      </div>
    `;
    backdrop.querySelector('#close-wa-wizard').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelectorAll('[data-wa-criterion]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const c = draft.criteria.find(x=>x.code===el.getAttribute('data-wa-criterion'));
        if(c) c.selected = el.checked;
      });
    });
    backdrop.querySelector('#wa-criteria-select-all').addEventListener('click', ()=>{
      draft.criteria.forEach(c=>c.selected=true); renderCriteriaStep();
    });
    backdrop.querySelector('#wa-criteria-select-none').addEventListener('click', ()=>{
      draft.criteria.forEach(c=>c.selected=false); renderCriteriaStep();
    });
    backdrop.querySelector('#wa-criteria-back-btn').addEventListener('click', ()=> renderPreview());
    backdrop.querySelector('#wa-criteria-next-btn').addEventListener('click', ()=>{
      const selected = draft.criteria.filter(c=>c.selected);
      if(!selected.length){ toast('Please select at least one criterion'); return; }
      // IB guidance (not a hard rule here): for summative I&S tasks, Criterion B should be
      // combined with at least one other criterion -- warn but let the teacher proceed anyway.
      if(isIS() && draft.type==='summative' && selected.length===1 && selected[0].code==='B'){
        toast('IB guidance: combine Criterion B with another criterion for summative tasks');
      }
      renderStrandsStep();
    });
  }

  /* ---- Step 4 (Eng Lit DP only): select Strands per selected Criterion, with optional task-specific description ---- */
  function renderStrandsStep(){
    const selected = draft.criteria.filter(c=>c.selected);
    const blocksHtml = selected.map(c=>`
      <div class="card" style="margin-top:10px;">
        <strong>${escapeHtml(c.code)}: ${escapeHtml(c.label)}</strong>
        ${c.strands.map((s,i)=>`
          <div style="margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
            <label style="cursor:pointer; display:flex; align-items:flex-start; gap:8px;">
              <input type="checkbox" data-wa-strand="${escapeHtml(c.code)}|${i}" ${s.selected?'checked':''} style="margin-top:3px;">
              <span>${escapeHtml(s.text)}</span>
            </label>
            <div style="margin-top:6px;">
              <span class="btn small ghost" data-wa-strand-desc-toggle="${escapeHtml(c.code)}|${i}">${s.descOpen ? '- Hide' : '+ Add'} task-specific description</span>
            </div>
            ${s.descOpen ? `<textarea data-wa-strand-desc="${escapeHtml(c.code)}|${i}" placeholder="Optional: describe how this strand applies to this specific task..." style="margin-top:6px;">${escapeHtml(s.taskDescription)}</textarea>` : ''}
          </div>`).join('')}
      </div>
    `).join('');
    backdrop.innerHTML = `
      <div class="modal">
        <div class="modal-header">
          <h3>Select Strands</h3>
          <button class="icon-btn" id="close-wa-wizard">&times;</button>
        </div>
        <div class="muted">For each criterion, select all or some of its strands. Use "+ Add" for an optional task-specific note.</div>
        ${blocksHtml}
        <div class="row" style="margin-top:14px;">
          <button class="btn ghost" id="wa-strands-back-btn">&larr; Back</button>
          <button class="btn primary" id="wa-strands-save-btn">Save Assessment</button>
        </div>
      </div>
    `;
    backdrop.querySelector('#close-wa-wizard').addEventListener('click', ()=>backdrop.remove());
    function findStrand(key){
      const [code, idxStr] = key.split('|');
      const c = draft.criteria.find(x=>x.code===code);
      return c ? c.strands[parseInt(idxStr,10)] : null;
    }
    backdrop.querySelectorAll('[data-wa-strand]').forEach(el=>{
      el.addEventListener('change', ()=>{
        const s = findStrand(el.getAttribute('data-wa-strand'));
        if(s) s.selected = el.checked;
      });
    });
    backdrop.querySelectorAll('[data-wa-strand-desc-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const s = findStrand(el.getAttribute('data-wa-strand-desc-toggle'));
        if(s){ s.descOpen = !s.descOpen; renderStrandsStep(); }
      });
    });
    backdrop.querySelectorAll('[data-wa-strand-desc]').forEach(el=>{
      el.addEventListener('input', ()=>{
        const s = findStrand(el.getAttribute('data-wa-strand-desc'));
        if(s) s.taskDescription = el.value;
      });
    });
    backdrop.querySelector('#wa-strands-back-btn').addEventListener('click', ()=> renderCriteriaStep());
    backdrop.querySelector('#wa-strands-save-btn').addEventListener('click', async ()=>{
      // I&S criteria are a flat Maximum: 8 in every year band -- no HL/SL-style doubling like
      // Eng Lit DP Paper 1 HL.
      const maxScore = isLit() ? litCriterionMaxScore(draft.litPaper, draft.litLevel) : 8;
      const assessment = draft.pendingAssessment;
      const subjectMeta = {
        criteria: draft.criteria.filter(c=>c.selected).map(c=>({
          code:c.code, label:c.label, groupLabel:c.groupLabel||null, selected:true, maxScore,
          strands: c.strands.filter(s=>s.selected).map(s=>({ text:s.text, selected:true, taskDescription:(s.taskDescription||'').trim() }))
        }))
      };
      if(isLit()){ subjectMeta.paper = draft.litPaper; subjectMeta.level = draft.litLevel; }
      if(isIS()){ subjectMeta.mypYear = draft.mypYear; }
      assessment.subjectMeta = subjectMeta;
      await dbAdd('writingAssessments', assessment);
      backdrop.remove();
      state.writingSelectedAssessmentId = assessment.id;
      state.writingView = 'detail';
      toast('Assessment created', 'good');
      render();
    });
  }

  renderSubjectStep();
  document.body.appendChild(backdrop);
}

/* ============ WRITING ASSESSMENT: manage entries modal ============ */
async function openManageWritingEntriesModal(polarity, skillKey){
  const assessment = await dbGet('writingAssessments', state.writingSelectedAssessmentId);
  const events = (await dbGetAllByIndex('writingEvents','assessmentId', state.writingSelectedAssessmentId))
    .filter(e=>e.studentId===state.writingSelectedStudentId && e.polarity===polarity && e.skillKey===skillKey)
    .sort((a,b)=>a.timestamp-b.timestamp);
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'wa-manage-modal-backdrop';
  const rowsHtml = events.map((e,i)=>{
    const criteriaLabel = (e.criteriaCodes && e.criteriaCodes.length) ? `<div class="muted" style="margin-top:2px;">Tagged to: ${e.criteriaCodes.map(escapeHtml).join(', ')}</div>` : '';
    return `
    <div class="row between" style="padding:8px 0; border-bottom:1px solid var(--line);">
      <span>${i+1}. ${e.quote ? `&ldquo;${escapeHtml(e.quote)}&rdquo;` : '<span class="muted">(no excerpt)</span>'}${criteriaLabel}</span>
      <button class="btn small danger" data-remove-entry="${e.id}">Remove</button>
    </div>`;
  }).join('');
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>${escapeHtml(writingSkillLabel(polarity, skillKey, assessment))}</h3>
        <button class="icon-btn" id="close-wa-manage-modal">&times;</button>
      </div>
      ${rowsHtml || '<div class="empty">No entries.</div>'}
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#close-wa-manage-modal').addEventListener('click', ()=>{ backdrop.remove(); });
  backdrop.querySelectorAll('[data-remove-entry]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await dbDelete('writingEvents', btn.getAttribute('data-remove-entry'));
      backdrop.remove();
      render();
    });
  });
}

// For Criteria assessments (Eng Lit DP, I&S MYP): instead of the plain quote-only prompt every
// other subject uses, this modal also lets the teacher multi-select which of the assessment's
// chosen Criteria the tap applies to -- that tagging is what lets the report later auto-attribute
// feedback to the Criterion that explains the score the student received.
async function openCriteriaTapModal(assessment, polarity, skillKey){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'wa-lit-tap-modal-backdrop';
  const criteria = assessment.subjectMeta.criteria;
  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>${escapeHtml(writingSkillLabel(polarity, skillKey, assessment))}</h3>
        <button class="icon-btn" id="close-wa-lit-tap-modal">&times;</button>
      </div>
      <div class="field">
        <label>Paragraph # / Sentence # or Quote (optional)</label>
        <textarea id="wa-lit-tap-quote" placeholder="e.g. Para 2, Sentence 3 -- or paste the quote..."></textarea>
      </div>
      <div class="field">
        <label>Which Criteria does this apply to? (optional, select any)</label>
        <div>${criteria.map(c=>`
          <label class="card row between" style="cursor:pointer; margin-top:6px;">
            <span>${escapeHtml(c.code)}: ${escapeHtml(c.label)}</span>
            <input type="checkbox" data-wa-lit-tap-criterion="${escapeHtml(c.code)}">
          </label>`).join('')}</div>
      </div>
      <button class="btn primary block" id="wa-lit-tap-save-btn">Save</button>
    </div>`;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#close-wa-lit-tap-modal').addEventListener('click', ()=> backdrop.remove());
  backdrop.querySelector('#wa-lit-tap-save-btn').addEventListener('click', async ()=>{
    const quote = backdrop.querySelector('#wa-lit-tap-quote').value.trim();
    const criteriaCodes = Array.from(backdrop.querySelectorAll('[data-wa-lit-tap-criterion]:checked')).map(el=>el.getAttribute('data-wa-lit-tap-criterion'));
    await dbAdd('writingEvents', {
      id: uuid(), assessmentId: state.writingSelectedAssessmentId, classId: state.currentClassId,
      studentId: state.writingSelectedStudentId, polarity, skillKey,
      quote: quote || null, criteriaCodes, timestamp: Date.now()
    });
    backdrop.remove();
    render();
  });
}

/* ============ WRITING ASSESSMENT: print / PDF export ============ */
function getPrintArea(){
  let el = document.getElementById('print-area');
  if(!el){ el = document.createElement('div'); el.id = 'print-area'; document.body.appendChild(el); }
  return el;
}
async function exportSingleWritingReport(assessmentId, studentId){
  const assessment = await dbGet('writingAssessments', assessmentId);
  const student = await dbGet('students', studentId);
  const feedback = await getOrCreateWritingFeedbackRecord(assessmentId, state.currentClassId, studentId);
  const tally = await computeWritingTally(assessmentId, studentId);
  getPrintArea().innerHTML = `<div class="wa-print-page">${writingReportContentHtml(assessment, student, feedback, tally)}</div>`;
  window.print();
}
async function exportAllWritingReports(assessmentId){
  const assessment = await dbGet('writingAssessments', assessmentId);
  const students = (await dbGetAllByIndex('students','classId', state.currentClassId))
    .filter(s=>s.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  const parts = [];
  for(const s of students){
    const feedback = await getWritingFeedbackRecord(assessmentId, s.id);
    if(!feedback || !feedback.submittedAt) continue;
    const tally = await computeWritingTally(assessmentId, s.id);
    parts.push(`<div class="wa-print-page">${writingReportContentHtml(assessment, s, feedback, tally)}</div>`);
  }
  if(parts.length===0){ toast('No submitted reports yet to export'); return; }
  getPrintArea().innerHTML = parts.join('');
  window.print();
}

/* ============ WRITING ASSESSMENT: event wiring ============ */
function wireWritingTabEvents(){
  const addBtn = document.getElementById('add-writing-assessment-btn');
  if(addBtn) addBtn.addEventListener('click', ()=> openWritingAssessmentWizard());

  document.querySelectorAll('[data-open-assessment]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.writingSelectedAssessmentId = el.getAttribute('data-open-assessment');
      state.writingView = 'detail';
      render();
    });
  });

  const backToListBtn = document.getElementById('back-to-writing-list');
  if(backToListBtn) backToListBtn.addEventListener('click', ()=>{
    state.writingView = 'list';
    state.writingSelectedAssessmentId = null;
    render();
  });

  const exportAllBtn = document.getElementById('export-all-writing-btn');
  if(exportAllBtn) exportAllBtn.addEventListener('click', ()=> exportAllWritingReports(state.writingSelectedAssessmentId));

  const deleteAssessmentBtn = document.getElementById('delete-writing-assessment-btn');
  if(deleteAssessmentBtn) deleteAssessmentBtn.addEventListener('click', async ()=>{
    const assessment = await dbGet('writingAssessments', state.writingSelectedAssessmentId);
    const ok = window.confirm(
      `Delete "${assessment ? assessment.title : 'this assessment'}" completely? This permanently erases every logged skill entry, quote, comment, and score for every student on it. This cannot be undone.`
    );
    if(!ok) return;
    await deleteWritingAssessmentCascade(state.writingSelectedAssessmentId);
    toast('Assessment deleted', 'good');
    state.writingView = 'list';
    state.writingSelectedAssessmentId = null;
    render();
  });

  document.querySelectorAll('[data-open-student]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.writingSelectedStudentId = el.getAttribute('data-open-student');
      state.writingView = 'student';
      state.writingStudentMode = null;
      render();
    });
  });
  document.querySelectorAll('[data-view-report]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      state.writingSelectedStudentId = el.getAttribute('data-view-report');
      state.writingView = 'student';
      state.writingStudentMode = 'report';
      render();
    });
  });

  const backToDetailBtn = document.getElementById('back-to-writing-detail');
  if(backToDetailBtn) backToDetailBtn.addEventListener('click', ()=>{
    state.writingView = 'detail';
    state.writingSelectedStudentId = null;
    state.writingStudentMode = null;
    render();
  });

  document.querySelectorAll('[data-wa-skill]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      if(ev.target.closest('[data-wa-manage]')) return;
      const skillKey = el.getAttribute('data-wa-skill');
      const polarity = el.getAttribute('data-wa-polarity');
      if(el.getAttribute('data-wa-criteria-tag')){
        const assessment = await dbGet('writingAssessments', state.writingSelectedAssessmentId);
        await openCriteriaTapModal(assessment, polarity, skillKey);
        return;
      }
      const quote = window.prompt('Quote the specific word, phrase, or sentence (optional) — Cancel to skip:');
      await dbAdd('writingEvents', {
        id: uuid(), assessmentId: state.writingSelectedAssessmentId, classId: state.currentClassId,
        studentId: state.writingSelectedStudentId, polarity, skillKey,
        quote: (quote && quote.trim()) ? quote.trim() : null, timestamp: Date.now()
      });
      render();
    });
  });

  document.querySelectorAll('[data-wa-manage]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      openManageWritingEntriesModal(el.getAttribute('data-wa-manage-polarity'), el.getAttribute('data-wa-manage'));
    });
  });

  document.querySelectorAll('[data-wa-score]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const field = el.getAttribute('data-wa-score');
      let value = el.getAttribute('data-wa-value');
      if(field==='dp' || field==='myp') value = parseInt(value,10);
      const feedback = await getOrCreateWritingFeedbackRecord(state.writingSelectedAssessmentId, state.currentClassId, state.writingSelectedStudentId);
      feedback.scores[field] = (feedback.scores[field] === value) ? null : value;
      feedback.updatedAt = Date.now();
      await dbPut('writingFeedback', feedback);
      render();
    });
  });

  document.querySelectorAll('[data-wa-criteria-score]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const code = el.getAttribute('data-wa-criteria-score');
      const value = parseInt(el.getAttribute('data-wa-value'),10);
      const feedback = await getOrCreateWritingFeedbackRecord(state.writingSelectedAssessmentId, state.currentClassId, state.writingSelectedStudentId);
      if(!feedback.scores.criteria) feedback.scores.criteria = {};
      feedback.scores.criteria[code] = (feedback.scores.criteria[code] === value) ? null : value;
      feedback.updatedAt = Date.now();
      await dbPut('writingFeedback', feedback);
      render();
    });
  });

  const commentInput = document.getElementById('wa-comment-input');
  if(commentInput){
    commentInput.addEventListener('input', async ()=>{
      const feedback = await getOrCreateWritingFeedbackRecord(state.writingSelectedAssessmentId, state.currentClassId, state.writingSelectedStudentId);
      feedback.comment = commentInput.value;
      feedback.updatedAt = Date.now();
      await dbPut('writingFeedback', feedback);
    });
  }

  const reviewBtn = document.getElementById('wa-review-btn');
  if(reviewBtn) reviewBtn.addEventListener('click', ()=>{
    state.writingStudentMode = 'review';
    render();
  });

  const backToEditBtn = document.getElementById('wa-back-to-edit-btn');
  if(backToEditBtn) backToEditBtn.addEventListener('click', ()=>{
    state.writingStudentMode = 'edit';
    render();
  });

  const submitFeedbackBtn = document.getElementById('wa-submit-feedback-btn');
  if(submitFeedbackBtn) submitFeedbackBtn.addEventListener('click', async ()=>{
    const feedback = await getOrCreateWritingFeedbackRecord(state.writingSelectedAssessmentId, state.currentClassId, state.writingSelectedStudentId);
    const firstTime = !feedback.submittedAt;
    if(!feedback.submittedAt) feedback.submittedAt = Date.now();
    feedback.updatedAt = Date.now();
    await dbPut('writingFeedback', feedback);
    toast(firstTime ? 'Feedback submitted' : 'Changes saved', 'good');
    if(firstTime){
      state.writingStudentMode = null;
      state.writingView = 'detail';
      state.writingSelectedStudentId = null;
    } else {
      state.writingStudentMode = 'report';
    }
    render();
  });

  const editFeedbackBtn = document.getElementById('wa-edit-feedback-btn');
  if(editFeedbackBtn) editFeedbackBtn.addEventListener('click', ()=>{
    state.writingStudentMode = 'edit';
    render();
  });

  const exportReportBtn = document.getElementById('wa-export-report-btn');
  if(exportReportBtn) exportReportBtn.addEventListener('click', ()=> exportSingleWritingReport(state.writingSelectedAssessmentId, state.writingSelectedStudentId));
}

/* ============ EXCEL EXPORT ============ */
async function exportClassToExcel(classId, opts){
  opts = opts || {};
  const cls = await dbGet('classes', classId);
  const students = (await dbGetAllByIndex('students','classId', classId)).sort((a,b)=>a.name.localeCompare(b.name));
  const events = await dbGetAllByIndex('events','classId', classId);
  const sessions = (await dbGetAllByIndex('sessions','classId', classId)).sort((a,b)=>a.date.localeCompare(b.date));
  const sessionDateById = {}; sessions.forEach(s=> sessionDateById[s.id]=s.date);
  const studentNameById = {}; students.forEach(s=> studentNameById[s.id]=s.name);

  const wb = XLSX.utils.book_new();

  // Sheet 1: Raw Log
  const rawHeader = ['Date','Session ID','Student','Category','Subtype','Called On','Amount','Note','Timestamp'];
  const rawRows = events
    .slice()
    .sort((a,b)=>a.timestamp-b.timestamp)
    .map(e=>[
      sessionDateById[e.sessionId] || '',
      e.sessionId,
      studentNameById[e.studentId] || '(removed student)',
      catLabel(e.category),
      subLabel(e.category, e.subtype) || '',
      e.viaRandomPick ? 'Yes' : '',
      e.amount || 1,
      e.note || '',
      new Date(e.timestamp).toISOString()
    ]);
  const rawSheet = XLSX.utils.aoa_to_sheet([rawHeader, ...rawRows]);
  XLSX.utils.book_append_sheet(wb, rawSheet, 'Raw Log');

  // Sheet 2: Roster (clean reference table of demographics)
  const rosterHeader = ['Name','House','Gender','Homeroom Group','Homeroom Teacher','Active'];
  const rosterRows = students.map(s=>[
    s.name,
    houseByKey(s.house) ? houseByKey(s.house).label : '',
    genderByKey(s.gender) ? genderByKey(s.gender).label : '',
    s.homeroomGroup || '',
    s.homeroomTeacher || '',
    s.active===false ? 'No' : 'Yes'
  ]);
  const rosterSheet = XLSX.utils.aoa_to_sheet([rosterHeader, ...rosterRows]);
  XLSX.utils.book_append_sheet(wb, rosterSheet, 'Roster');

  // Sheet 3: Class Summary (students x categories totals, amount-weighted)
  const rows = allRowKeys();
  const classCounts = {};
  students.forEach(s=> classCounts[s.id] = {});
  events.forEach(e=>{
    const k = e.category+'|'+e.subtype;
    if(!classCounts[e.studentId]) classCounts[e.studentId] = {};
    classCounts[e.studentId][k] = (classCounts[e.studentId][k]||0) + (e.amount||1);
  });
  const usedRowsClass = rows.filter(r=>{
    const k = r.category+'|'+r.subtype;
    return students.some(s=> (classCounts[s.id]||{})[k] > 0);
  });
  const summaryHeader = ['Category', ...students.map(s=> studentHeaderLabel(s))];
  const summaryRows = usedRowsClass.map(r=>{
    const k = r.category+'|'+r.subtype;
    return [r.label, ...students.map(s=> (classCounts[s.id]||{})[k] || 0)];
  });
  const summarySheet = XLSX.utils.aoa_to_sheet([summaryHeader, ...summaryRows]);
  XLSX.utils.book_append_sheet(wb, summarySheet, 'Class Summary');

  // Sheet 4: House Balance (positive vs negative, by house)
  const houseGroupsExport = {}; HOUSES.forEach(h=> houseGroupsExport[h.key]=[]);
  let unassignedExport = [];
  events.forEach(e=>{
    const student = students.find(s=>s.id===e.studentId);
    if(student && student.house && houseGroupsExport[student.house]) houseGroupsExport[student.house].push(e);
    else unassignedExport.push(e);
  });
  const houseHeader = ['House','Positive','Negative'];
  const houseRows = HOUSES.map(h=>{
    const b = computeBalance(houseGroupsExport[h.key]);
    return [h.label, b.pos, b.neg];
  });
  if(unassignedExport.length){
    const b = computeBalance(unassignedExport);
    houseRows.push(['Unassigned', b.pos, b.neg]);
  }
  const houseSheet = XLSX.utils.aoa_to_sheet([houseHeader, ...houseRows]);
  XLSX.utils.book_append_sheet(wb, houseSheet, 'House Balance');

  // Sheet per student: pivot (category rows x date cols, amount-weighted)
  const dates = [...new Set(sessions.map(s=>s.date))].sort();
  const usedSheetNames = new Set(['Raw Log','Roster','Class Summary','House Balance']);
  for(const s of students){
    const studentEvents = events.filter(e=>e.studentId===s.id);
    if(studentEvents.length===0) continue;
    const counts = {};
    studentEvents.forEach(e=>{
      const date = sessionDateById[e.sessionId];
      if(!date) return;
      const k = e.category+'|'+e.subtype;
      if(!counts[k]) counts[k] = {};
      counts[k][date] = (counts[k][date]||0) + (e.amount||1);
    });
    const usedRowsS = rows.filter(r=>{
      const k = r.category+'|'+r.subtype;
      return counts[k] && Object.values(counts[k]).some(v=>v>0);
    });
    const header = ['Category', ...dates.map(formatDateNice)];
    const body = usedRowsS.map(r=>{
      const k = r.category+'|'+r.subtype;
      return [r.label, ...dates.map(d=> (counts[k] && counts[k][d]) || 0)];
    });
    let sheetName = sanitizeSheetName(s.name);
    let n = 1;
    while(usedSheetNames.has(sheetName)){ n++; sheetName = sanitizeSheetName(s.name+' '+n); }
    usedSheetNames.add(sheetName);
    const sheet = XLSX.utils.aoa_to_sheet([header, ...body]);
    XLSX.utils.book_append_sheet(wb, sheet, sheetName);
  }

  const filename = `${(cls?cls.name:'class').replace(/[^a-z0-9\-_]/gi,'_')}_backup_${todayStr()}.xlsx`;
  try{
    XLSX.writeFile(wb, filename);
    if(!opts.silent) toast('Backup exported: '+filename, 'good');
  }catch(err){
    console.error(err);
    toast('Export failed — see console');
  }
}
