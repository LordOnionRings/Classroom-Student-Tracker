<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Classroom Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1f2430; --muted:#6b7280; --line:#e3e5ea;
    --accent:#2f6fed; --accent-ink:#ffffff; --good:#2f9e5f; --warn:#c2410c; --bad:#c0392b;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-touch-callout:none;
  }
  #app{max-width:1100px; margin:0 auto; padding:16px 16px 80px;}
  h1,h2,h3,h4{margin:0 0 4px;}
  .row{display:flex; align-items:center; gap:10px;}
  .row.between{justify-content:space-between;}
  .row.wrap{flex-wrap:wrap;}
  .muted{color:var(--muted); font-size:13px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:10px 0 16px;}
  .topbar .title{font-size:20px; font-weight:700;}
  .btn{
    appearance:none; border:none; border-radius:10px; padding:12px 18px; font-size:15px; font-weight:600;
    background:var(--panel); color:var(--ink); border:1px solid var(--line); cursor:pointer;
  }
  .btn:active{transform:scale(0.97);}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn.ghost{background:transparent; border-color:transparent; color:var(--accent); padding:8px 10px;}
  .btn.danger{background:#fff; color:var(--bad); border-color:#f1c2be;}
  .btn.small{padding:8px 12px; font-size:13px; border-radius:8px;}
  .btn.block{width:100%;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
  .card.clickable{cursor:pointer;}
  .card.clickable:active{transform:scale(0.995);}
  .grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;}
  input[type=text], textarea, select{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); font-size:15px; background:#fff; color:var(--ink);
  }
  input[type=checkbox]{width:auto;}
  textarea{resize:vertical; min-height:64px;}
  label{font-size:13px; color:var(--muted); display:block; margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:16px;}
  .tab{padding:10px 16px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent;}
  .tab.active{color:var(--accent); border-color:var(--accent);}
  .session-banner{
    display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-radius:12px;
    background:#eef3ff; border:1px solid #cfe0ff; margin-bottom:14px; font-size:14px;
  }
  .session-banner.closed{background:#f1f2f4; border-color:var(--line);}
  .student-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
  .student-btn{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 10px;
    min-height:96px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; cursor:pointer; text-align:center; position:relative; border-top:5px solid transparent;
  }
  .student-btn:active{transform:scale(0.96); background:#eef3ff;}
  .student-avatar{
    width:44px; height:44px; border-radius:50%; background:#8a94a6; color:#fff; font-weight:700;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
  }
  .student-name{font-weight:600; font-size:14px;}
  .event-badge{
    position:absolute; top:8px; right:8px; background:var(--ink); color:#fff; font-size:11px; font-weight:700;
    border-radius:10px; padding:2px 7px;
  }
  .answered-badge{
    position:absolute; bottom:8px; right:8px; width:18px; height:18px; border-radius:50%;
    background:var(--good); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,22,30,0.5); display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  @media(min-width:640px){ .modal-backdrop{align-items:center;} }
  .modal{
    background:#fff; width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0;
    padding:20px; animation:up .15s ease-out;
  }
  @media(min-width:640px){ .modal{border-radius:18px;} }
  @keyframes up{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cat-btn{
    display:block; width:100%; text-align:left; padding:16px; border-radius:12px; border:1px solid var(--line);
    background:#fafbfc; font-size:16px; font-weight:600; margin-bottom:10px; cursor:pointer;
  }
  .cat-btn:active{transform:scale(0.98);}
  .cat-btn .tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; margin-left:8px; vertical-align:middle;}
  .tag.neutral{background:#e7e9ee; color:#4b5563;}
  .tag.negative{background:#fbe4e1; color:var(--bad);}
  .tag.positive{background:#e2f5e9; color:var(--good);}
  .tag.warn{background:#fff4e5; color:var(--warn);}
  #print-area{display:none;}
  @media print{
    body > *:not(#print-area){display:none !important;}
    #print-area{display:block !important;}
    .wa-print-page{page-break-after:always;}
  }
  .chip{
    display:inline-flex; padding:9px 14px; border-radius:20px; border:1px solid var(--line); background:#fff;
    font-size:14px; font-weight:600; cursor:pointer; margin:0 8px 8px 0;
  }
  .chip.selected{background:var(--accent); color:#fff; border-color:var(--accent);}
  .toast-root{position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-size:14px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,0.2); animation:fade .25s ease-out;}
  .toast.good{background:var(--good);}
  @keyframes fade{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
  table.pivot{border-collapse:collapse; width:100%; font-size:13px;}
  table.pivot th, table.pivot td{border:1px solid var(--line); padding:8px 10px; text-align:center; white-space:nowrap;}
  table.pivot th.rowlabel, table.pivot td.rowlabel{text-align:left; position:sticky; left:0; background:#fff; font-weight:600;}
  table.pivot th{background:#f7f8fa;}
  .scroll-x{overflow-x:auto; border:1px solid var(--line); border-radius:12px;}
  .badge-never{background:#fff4e5; color:var(--warn); font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
  .badge-recent{background:#eee; color:var(--muted); font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;}
  .empty{padding:40px 20px; text-align:center; color:var(--muted);}
  .footer-actions{position:sticky; bottom:0; background:linear-gradient(to top, var(--bg) 60%, transparent); padding:14px 0 4px; margin-top:10px;}
  .icon-btn{background:transparent; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:4px 8px;}
  a.link{color:var(--accent); font-weight:600; text-decoration:none;}
  .swatch{width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0;}
  .swatch.selected{border-color:var(--ink);}
  .house-dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle;}
  .balance-row{display:flex; align-items:center; justify-content:space-between; padding:6px 0; gap:10px;}
  .directory-row{display:flex; align-items:flex-start; gap:10px; padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root" class="toast-root"></div>

<script>
/* ============ CONFIG: EVENT TAXONOMY ============ */
const TAXONOMY = [
  { key:'shares_idea', label:'Shares Idea', polarity:'neutral',
    subtypes:[
      {key:'good_answer', label:'Good Answer'},
      {key:'creative', label:'Creative'},
      {key:'poor_logic', label:'Poor Logic'},
      {key:'off_topic', label:'Off-Topic'}
    ]},
  { key:'arrives_late', label:'Arrives Late', polarity:'negative', subtypes:null },
  { key:'absent', label:'Absent', polarity:'negative', subtypes:null },
  { key:'sleeping', label:'Sleeping', polarity:'negative', subtypes:null },
  { key:'not_doing_work', label:'Not Doing Work', polarity:'negative', subtypes:null },
  { key:'disruptive', label:'Disruptive', polarity:'negative',
    subtypes:[
      {key:'chatting', label:'Chatting with Others'},
      {key:'making_noise', label:'Making Noise'},
      {key:'fiddling', label:'Fiddling'},
      {key:'other', label:'Other'}
    ]},
  { key:'unprepared', label:'Unprepared for Class', polarity:'negative',
    subtypes:[
      {key:'no_materials', label:'No Materials'},
      {key:'forgot_homework', label:'Forgot Homework'},
      {key:'forgot_device', label:'Forgot Device'}
    ]}
];
const REASON_TAGS = ['Great Insight','Helped a Classmate','Improved Effort','Strong Focus','Creative Thinking','Kindness'];
const NO_ENTRIES_KEY = 'no_entries';
const STUDENT_OF_CLASS_KEY = 'student_of_class';

const HOUSES = [
  { key:'jackal', label:'Jackal', color:'#E07B39' },
  { key:'cobra', label:'Cobra', color:'#C0392B' },
  { key:'iguana', label:'Iguana', color:'#2F9E5F' },
  { key:'dolphin', label:'Dolphin', color:'#2F6FED' }
];
function houseByKey(key){ return HOUSES.find(h=>h.key===key) || null; }

const GENDERS = [
  { key:'male', label:'Male', color:'#2f6fed' },
  { key:'female', label:'Female', color:'#e0559c' }
];
function genderByKey(key){ return GENDERS.find(g=>g.key===key) || null; }

const HOMEROOM_GROUPS = ['Group 1', 'Group 2', 'Group 3'];

/* ---- Breakout Groups ---- */
const BREAKOUT_GROUP_SIZES = [2,3,4,5,6,7,8,9,10];

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Round-robin interleave across whatever keyFn buckets students into, so consecutive
// students in the returned list are as diverse as possible on that attribute.
function interleaveByKey(students, keyFn){
  const buckets = {};
  const order = [];
  students.forEach(s=>{
    const k = keyFn(s) || '_unset';
    if(!buckets[k]){ buckets[k] = []; order.push(k); }
    buckets[k].push(s);
  });
  order.forEach(k=> buckets[k] = shuffleArray(buckets[k]));
  // Shuffle the order buckets are VISITED in too, not just their contents. Without this,
  // regenerating groups for a class split across many small buckets (e.g. 2 genders x 4
  // houses in a mid-size class) can come out looking identical every time -- most buckets
  // only have 1 student, so there's nothing to shuffle inside them, and the visiting order
  // was the only other source of variation.
  const visitOrder = shuffleArray(order);
  const result = [];
  let remaining = true;
  while(remaining){
    remaining = false;
    for(const k of visitOrder){
      if(buckets[k].length){ result.push(buckets[k].shift()); remaining = true; }
    }
  }
  return result;
}
// Splits an ordered list into groups of `size`. A lone leftover student (remainder of 1)
// is folded into the last group rather than left alone; a remainder of 2+ stands as its
// own smaller group.
function splitIntoGroups(list, size){
  const n = list.length;
  if(n === 0) return [];
  if(n <= size) return [list.slice()];
  const numFull = Math.floor(n / size);
  const remainder = n % size;
  const groups = [];
  let idx = 0;
  if(remainder === 0){
    for(let g=0; g<numFull; g++){ groups.push(list.slice(idx, idx+size)); idx += size; }
  } else if(remainder === 1){
    for(let g=0; g<numFull; g++){
      const thisSize = (g === numFull-1) ? size+1 : size;
      groups.push(list.slice(idx, idx+thisSize));
      idx += thisSize;
    }
  } else {
    for(let g=0; g<numFull; g++){ groups.push(list.slice(idx, idx+size)); idx += size; }
    groups.push(list.slice(idx, idx+remainder));
  }
  return groups;
}
// genderMode/houseMode: 'aligned' (same value grouped together) or 'mixed' (spread across groups).
function buildBreakoutGroups(students, groupSize, genderMode, houseMode){
  const attrFn = { gender: s=>s.gender||'unset', house: s=>s.house||'unset' };
  const alignedDims = [];
  if(genderMode==='aligned') alignedDims.push('gender');
  if(houseMode==='aligned') alignedDims.push('house');
  const mixedDims = ['gender','house'].filter(d=> !alignedDims.includes(d));

  let buckets;
  if(alignedDims.length){
    buckets = {};
    students.forEach(s=>{
      const key = alignedDims.map(d=>attrFn[d](s)).join('|');
      (buckets[key] = buckets[key] || []).push(s);
    });
  } else {
    buckets = { all: students.slice() };
  }

  const allGroups = [];
  shuffleArray(Object.keys(buckets)).forEach(key=>{
    let list = buckets[key];
    list = mixedDims.length
      ? interleaveByKey(list, s=> mixedDims.map(d=>attrFn[d](s)).join('|'))
      : shuffleArray(list);
    splitIntoGroups(list, groupSize).forEach(g=> allGroups.push(g));
  });

  return allGroups.map((studentList, i)=>({
    id: uuid(),
    label: `Group ${i+1}`,
    studentIds: studentList.map(s=>s.id)
  }));
}

/* ============ WRITING ASSESSMENT ============ */
const WRITING_TYPES = ['Compare and Contrast','Unseen Extract','Analysis Essay','Argumentative Essay','Other'];
const WRITING_ASSESSMENT_METHODS = [
  { key:'comments', label:'Comments' },
  { key:'myp_scale', label:'MYP Grading Scale (1–8)' },
  { key:'dp_scale', label:'DP Grading Scale (1–7)' },
  { key:'be_ae_me_ee', label:'BE / AE / ME / EE' }
];
// Core 10 apply to every assessment; the DP-level 5 only show up when the assessment's
// methods include the DP Grading Scale (higher-level analytical skills aren't relevant
// to earlier MYP writing).
// Descriptions are starter drafts (plain-language, student-facing) so the two-column list
// isn't just jargon -- Mike may replace these later via an Excel import of his own department's
// wording, same pattern as the student directory import.
const WRITING_SKILLS_NEGATIVE = [
  { key:'missing_thesis', label:'Missing Thesis', description:'The essay does not state a clear central argument or claim.' },
  { key:'unclear_thesis', label:'Unclear Thesis', description:'A thesis is present but is vague, unfocused, or hard to identify.' },
  { key:'poor_organization', label:'Poor Organization', description:"Ideas aren't arranged in a logical, easy-to-follow order." },
  { key:'weak_topic_sentences', label:'Weak Topic Sentences', description:"Paragraphs don't open with a clear signpost of what that paragraph will argue." },
  { key:'inconsistent_verb_tense', label:'Inconsistent Verb Tense', description:'Verb tense shifts unintentionally within or between sentences.' },
  { key:'weak_evidence', label:'Weak Evidence', description:'Claims are not well supported by specific, relevant evidence from the text.' },
  { key:'missing_peel', label:'Missing PEEL Structure', description:'Paragraphs skip one or more parts of Point-Evidence-Explain-Link.' },
  { key:'poor_punctuation', label:'Poor Punctuation', description:'Punctuation errors (commas, run-ons, fragments) interfere with clarity.' },
  { key:'inconsistent_word_choice', label:'Inconsistent Word Choice', description:'Vocabulary or tone shifts inappropriately, or word choice is imprecise.' },
  { key:'weak_conclusion', label:'Weak Conclusion', description:"The conclusion doesn't effectively wrap up or reinforce the argument." },
  { key:'ignores_counterarguments', label:'Ignores Counterarguments', description:'The essay does not acknowledge or respond to opposing viewpoints.', dpOnly:true },
  { key:'descriptive_not_analytical', label:'Descriptive Not Analytical', description:'The writing summarizes or describes rather than analyzing why or how it matters.', dpOnly:true },
  { key:'weak_quote_integration', label:'Weak Quote Integration', description:'Quotes are dropped in without being introduced or explained.', dpOnly:true },
  { key:'missing_key_context', label:'Missing Key Context', description:'Necessary background or contextual information is left out.', dpOnly:true },
  { key:'irrelevant_context', label:'Irrelevant Context or Arguments', description:"Included context or arguments don't actually support the essay's point.", dpOnly:true }
];
const WRITING_SKILLS_POSITIVE = [
  { key:'clear_thesis', label:'Clear Thesis', description:'States a specific, well-defined central argument.' },
  { key:'strong_organization', label:'Strong Organization', description:'Ideas are arranged in a logical order that is easy to follow.' },
  { key:'strong_topic_sentences', label:'Strong Topic Sentences', description:'Each paragraph opens with a clear signpost of its argument.' },
  { key:'consistent_verb_tense', label:'Consistent Verb Tense', description:'Verb tense stays consistent throughout.' },
  { key:'strong_evidence', label:'Strong Evidence', description:'Claims are backed by specific, relevant evidence.' },
  { key:'uses_peel', label:'Uses PEEL Structure', description:'Paragraphs follow Point-Evidence-Explain-Link clearly.' },
  { key:'strong_punctuation', label:'Strong Punctuation', description:'Punctuation is accurate and supports clarity.' },
  { key:'precise_word_choice', label:'Precise Word Choice', description:'Vocabulary is specific, accurate, and appropriate to the task.' },
  { key:'strong_conclusion', label:'Strong Conclusion', description:'Effectively reinforces the argument and brings the essay to a close.' },
  { key:'focused_argument', label:'Focused Argument', description:'Stays tightly on-topic without drifting from the central claim.' },
  { key:'engages_counterarguments', label:'Engages Counterarguments', description:'Acknowledges and responds to opposing viewpoints.', dpOnly:true },
  { key:'strong_analysis', label:'Strong Analysis', description:'Goes beyond description to explain significance and meaning.', dpOnly:true },
  { key:'strong_quote_integration', label:'Strong Quote Integration', description:'Quotes are introduced, embedded, and explained smoothly.', dpOnly:true },
  { key:'relevant_outside_context', label:'Includes Relevant Outside Context', description:'Brings in background or context that directly supports the argument.', dpOnly:true },
  { key:'nuanced_reasoning', label:'Nuanced Reasoning', description:'Considers complexity and multiple angles rather than oversimplifying.', dpOnly:true }
];
function writingSkillsForAssessment(assessment, list){
  const includeDp = assessment && assessment.methods && assessment.methods.includes('dp_scale');
  return list.filter(s=> !s.dpOnly || includeDp);
}
function writingSkillMeta(polarity, key, assessment){
  // When the tap belongs to a Lit assessment, look the key up in that paper's feedback
  // modules first -- Lit module keys (e.g. "signposting") are a different namespace than the
  // general taxonomy keys, so assessment context is required to resolve them correctly.
  if(assessment && isLitAssessment(assessment)){
    const m = litModulesForPaper(assessment.subjectMeta.paper).find(x=>x.key===key);
    if(m) return { key:m.key, label:m.label, description: polarity==='positive' ? m.positive : m.negative };
  }
  const list = polarity==='positive' ? WRITING_SKILLS_POSITIVE : WRITING_SKILLS_NEGATIVE;
  return list.find(x=>x.key===key) || null;
}
function writingSkillLabel(polarity, key, assessment){
  const s = writingSkillMeta(polarity, key, assessment);
  return s ? s.label : key;
}
function writingSkillDescription(polarity, key, assessment){
  const s = writingSkillMeta(polarity, key, assessment);
  return s ? s.description : '';
}

/* ============ WRITING ASSESSMENT: subject / DP Lit criteria & strands ============ */
// Fixed subject list for the beta. Only "Eng Lit DP" gets the full paper/criteria/strand
// treatment below; every other subject just uses the general skill taxonomy above with no
// criteria step, exactly as the app already behaves today. More subjects (with their own
// criteria) get added to this same pattern once Mike has them organized.
const SUBJECTS = [
  'Language Acquisition MYP','Language and Literature MYP','Individuals and Societies MYP',
  'Eng Lit DP','Eng Language DP','History DP','Geography DP'
];

// Strands are the guiding-question bullets under each IB criterion descriptor (confirmed with
// Mike). A criterion with one bullet has one strand; Criterion A/D have two.
const LIT_CRITERIA_PAPER1 = [
  { code:'A', label:'Understanding and interpretation', strands:[
    'How well does the candidate demonstrate an understanding of the text and draw reasoned conclusions from implications in it?',
    'How well are ideas supported by references to the text?'
  ]},
  { code:'B', label:'Analysis and evaluation', strands:[
    'To what extent does the candidate analyse and evaluate how textual features and/or authorial choices shape meaning?'
  ]},
  { code:'C', label:'Focus and organization', strands:[
    'How well organized, coherent and focused is the presentation of ideas?'
  ]},
  { code:'D', label:'Language', strands:[
    'How clear, varied and accurate is the language?',
    'How appropriate is the choice of register and style?'
  ]}
];
// B1/B2 are modeled as two independent criteria (each separately selectable, strand-able, and
// taggable on a feedback tap) but share a groupLabel so the UI can still show them nested under
// one "Criterion B" heading, per Mike's confirmed answer.
const LIT_CRITERIA_PAPER2 = [
  { code:'A', label:'Knowledge, understanding and interpretation', strands:[
    'How much knowledge and understanding does the candidate demonstrate of the works in relation to the question?'
  ]},
  { code:'B1', label:'Analysis and evaluation of textual features', groupLabel:'Criterion B: Analysis and evaluation', strands:[
    'To what extent does the candidate analyse and evaluate how meaning is shaped by the choices of language, technique and style, and/or broader authorial choices?'
  ]},
  { code:'B2', label:'Comparative analysis', groupLabel:'Criterion B: Analysis and evaluation', strands:[
    'How effectively does the candidate analyse similarities and/or differences between the two works studied?'
  ]},
  { code:'C', label:'Focus and organization', strands:[
    'How well structured, balanced and focused is the presentation of ideas?'
  ]},
  { code:'D', label:'Language', strands:[
    'How clear, varied and accurate is the language?',
    'How appropriate is the choice of register and style?'
  ]}
];

// Feedback modules replace the general skill taxonomy for Eng Lit DP assessments. Each has a
// single key with a distinct positive ("Good") and negative ("Point for Improvement") description,
// sourced directly from the department's grading/analysis checkpoints document.
const LIT_FEEDBACK_MODULES_PAPER1 = [
  { key:'literal_understanding', label:'Literal Understanding', positive:'Literal understanding is clear and accurate.', negative:'There is a questionable reading or misreading of the text.' },
  { key:'thesis', label:'Thesis', positive:'Thesis has a rich idea with wider implications.', negative:'Thesis is ambiguous or unrefined.' },
  { key:'points', label:'Points', positive:'Points develop based on the rich idea.', negative:"Points make examiner think 'so what?'" },
  { key:'signposting', label:'Signposting', positive:'Signposting is clear and accurate.', negative:'Signposting is unrefined or unclear.' },
  { key:'quotations', label:'Quotations', positive:'Quotations are embedded well.', negative:'Quotations are poorly integrated.' },
  { key:'analysis', label:'Analysis', positive:'Analysis focuses on author and craft.', negative:'Analysis is descriptive and/or focuses mostly on content and character.' },
  { key:'evaluation', label:'Evaluation', positive:'Evaluation is insightful.', negative:'Evaluation does not progress insight.' },
  { key:'readership', label:'Readership', positive:'Readership is evaluated.', negative:'There is no/minimal evaluation of readership.' },
  { key:'terminology', label:'Terminology', positive:'Use of terminology is accurate.', negative:'Use of terminology is inaccurate or questionable.' },

// Subject-agnostic check used everywhere the wizard/report/scoring UI needs to know whether an
// assessment carries the Criteria + Strand structure (Eng Lit DP and I&S MYP today, any future
// subject built the same way tomorrow) rather than the plain skill-taxonomy flow every other
// subject uses.
function hasCriteriaFlow(assessment){
  return !!(assessment && assessment.subjectMeta && Array.isArray(assessment.subjectMeta.criteria) && assessment.subjectMeta.criteria.length);
}
// Builds the "<Paper 2 · HL>" / "<Year 5>" suffix shown next to the subject name. Empty string
// for subjects with no extra meta (which callers treat as "no suffix to show").

  if(isLitAssessment(assessment)){
    return `${assessment.subjectMeta.paper==='paper2'?'Paper 2':'Paper 1'} &middot; ${escapeHtml(assessment.subjectMeta.level||'')}`;
  }
  if(isISAssessment(assessment)){
    return escapeHtml(assessment.subjectMeta.mypYear||'');
  }
  return '';
}
function writingNegSkillsForAssessment(assessment){
  if(isLitAssessment(assessment)){
    return litModulesForPaper(assessment.subjectMeta.paper).map(m=>({ key:m.key, label:m.label, description:m.negative }));
  }
  return writingSkillsForAssessment(assessment, WRITING_SKILLS_NEGATIVE);
}
function writingPosSkillsForAssessment(assessment){
  if(isLitAssessment(assessment)){
    return litModulesForPaper(assessment.subjectMeta.paper).map(m=>({ key:m.key, label:m.label, description:m.positive }));
  }
  return writingSkillsForAssessment(assessment, WRITING_SKILLS_POSITIVE);
}
// Sums whatever criterion scores have been entered so far. Returns both the running total and
// the max-if-fully-scored, plus whether every selected criterion has a score yet (so the UI can
// flag an incomplete grade rather than silently showing a partial number as final).
function computeWritingCriteriaTotal(assessment, feedback){
  if(!hasCriteriaFlow(assessment)) return null;
  const criteria = assessment.subjectMeta.criteria.filter(c=>c.selected);
  const scores = (feedback && feedback.scores && feedback.scores.criteria) || {};
  let total = 0, max = 0, complete = true;
  criteria.forEach(c=>{
    max += c.maxScore;
    const v = scores[c.code];
    if(v==null) complete = false; else total += v;
  });
  return { total, max, complete };
}

/* ---- Auto-compute current grade level from a cohort's graduating year ---- */
// Assumes a school year that ends mid-year (default cutoff: July) and that a cohort
// graduates as Grade 12 at the end of its final year, e.g. cohort "2032-2033" graduates
// in 2033. Works backward from today's date to say what grade that cohort is THIS year.
function currentSchoolYearEndYear(date){
  date = date || new Date();
  const month = date.getMonth(); // 0 = Jan
  const year = date.getFullYear();
  return month >= 6 ? year + 1 : year; // Jul-Dec counts toward next calendar year's end
}
function cohortGraduationYear(cohort){
  const range = String(cohort).match(/(\d{4})\s*-\s*(\d{4})/);
  if(range) return parseInt(range[2], 10);
  const single = String(cohort).match(/(\d{4})/);
  return single ? parseInt(single[1], 10) : null;
}
function gradeForCohort(cohort, atDate){
  const gradYear = cohortGraduationYear(cohort);
  if(gradYear == null) return null;
  const nowEnd = currentSchoolYearEndYear(atDate);
  const grade = 12 - (gradYear - nowEnd);
  if(grade < 1 || grade > 12) return null; // outside typical K-12 range — don't guess
  return grade;
}
function cohortDisplayLabel(cohort, atDate){
  const grade = gradeForCohort(cohort, atDate);
  return grade != null ? `G${grade} (${cohort})` : cohort;
}
function avatarColor(student){
  const g = genderByKey(student && student.gender);
  return g ? g.color : '#8a94a6';
}

function catLabel(catKey){
  if(catKey === NO_ENTRIES_KEY) return 'No Entries Logged';
  if(catKey === STUDENT_OF_CLASS_KEY) return 'Student of the Class';
  const c = TAXONOMY.find(t=>t.key===catKey);
  return c ? c.label : catKey;
}
function subLabel(catKey, subKey){
  if(!subKey) return null;
  const c = TAXONOMY.find(t=>t.key===catKey);
  const s = c && c.subtypes ? c.subtypes.find(x=>x.key===subKey) : null;
  return s ? s.label : subKey;
}
function rowLabel(catKey, subKey){
  const cl = catLabel(catKey);
  const sl = subLabel(catKey, subKey);
  return sl ? (cl + ' - ' + sl) : cl;
}
function studentHeaderLabel(s){
  const bits = [];
  const house = houseByKey(s.house); if(house) bits.push(house.label);
  if(s.gender==='male') bits.push('M'); else if(s.gender==='female') bits.push('F');
  return s.name + (bits.length ? ' ('+bits.join(', ')+')' : '');
}

/* ---- Positive/negative "balance" scoring, used only for the quick-glance charts ---- */
function eventSignedValue(e){
  if(e.category === STUDENT_OF_CLASS_KEY) return 1;
  if(e.category === NO_ENTRIES_KEY) return 0;
  if(e.category === 'shares_idea'){
    if(e.subtype === 'good_answer' || e.subtype === 'creative') return 1;
    if(e.subtype === 'off_topic') return -1;
    return 0; // poor_logic: neutral, still participating
  }
  const cat = TAXONOMY.find(t=>t.key===e.category);
  if(cat && cat.polarity === 'negative') return -1;
  return 0;
}
function computeBalance(events){
  let pos = 0, neg = 0;
  events.forEach(e=>{
    const v = eventSignedValue(e);
    if(v > 0) pos += v; else if(v < 0) neg += -v;
  });
  return { pos, neg };
}
function renderBalanceBar(pos, neg, width){
  width = width || 200;
  const total = pos + neg;
  const posW = total > 0 ? Math.round((pos/total)*width) : 0;
  const negW = total > 0 ? Math.round((neg/total)*width) : 0;
  return `
    <div class="row" style="gap:8px;">
      <svg width="${width}" height="14" style="border-radius:7px; overflow:hidden; background:#e7e9ee; flex-shrink:0;">
        <rect x="0" y="0" width="${posW}" height="14" fill="#2f9e5f"></rect>
        <rect x="${posW}" y="0" width="${negW}" height="14" fill="#c0392b"></rect>
      </svg>
      <span class="muted" style="font-size:12px; white-space:nowrap;">+${pos} / -${neg}</span>
    </div>`;
}

/* ============ UTIL ============ */
function uuid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatDateNice(dstr){
  const [y,m,d] = dstr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
}
function dateStrToDate(dstr){
  const [y,m,d] = dstr.split('-').map(Number);
  return new Date(y, m-1, d);
}
function dateToDateStr(dt){
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function addDaysToDateStr(dstr, days){
  const dt = dateStrToDate(dstr);
  dt.setDate(dt.getDate()+days);
  return dateToDateStr(dt);
}
function mondayOfWeekContaining(dstr){
  const dt = dateStrToDate(dstr);
  const dow = dt.getDay(); // 0=Sun..6=Sat
  const diffToMonday = (dow===0) ? -6 : (1-dow);
  dt.setDate(dt.getDate()+diffToMonday);
  return dateToDateStr(dt);
}
function reportWeekRange(offsetWeeks){
  const thisMonday = mondayOfWeekContaining(todayStr());
  const start = addDaysToDateStr(thisMonday, (offsetWeeks||0)*7);
  const end = addDaysToDateStr(start, 6);
  return { start, end };
}
function initials(name){
  return name.trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase();
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function sanitizeSheetName(name){
  let n = String(name).replace(/[\\\/\?\*\[\]:]/g,' ').trim();
  if(n.length>31) n = n.slice(0,31);
  if(n.length===0) n = 'Sheet';
  return n;
}
function toast(msg, kind){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 1600);
}
function normalizeKey(k){ return String(k||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function normalizeRow(row){
  const out = {};
  Object.keys(row).forEach(k=>{ out[normalizeKey(k)] = row[k]; });
  return out;
}
function getField(normalizedRow, ...candidates){
  for(const c of candidates){
    const nk = normalizeKey(c);
    if(normalizedRow[nk] !== undefined && normalizedRow[nk] !== null) return normalizedRow[nk];
  }
  return '';
}
function normalizeGenderValue(v){
  const s = String(v||'').trim().toLowerCase();
  if(s.startsWith('m')) return 'male';
  if(s.startsWith('f')) return 'female';
  return null;
}
function normalizeHouseValue(v){
  const s = String(v||'').trim().toLowerCase();
  if(!s) return null;
  // Tolerate things like "Jackal House", "jackal ", "Jac" (short forms), not just an exact match.
  const h = HOUSES.find(h=> h.key===s || h.label.toLowerCase()===s || s.startsWith(h.key) || h.key.startsWith(s));
  return h ? h.key : null;
}

/* ============ INDEXEDDB LAYER ============ */
const DB_NAME = 'classroomTrackerDB';
const DB_VERSION = 3; // v3 adds the writing-assessment stores; existing stores are untouched on upgrade

function openDB(){
  if(openDB._p) return openDB._p;
  openDB._p = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('classes')){
        db.createObjectStore('classes', {keyPath:'id'});
      }
      if(!db.objectStoreNames.contains('students')){
        const s = db.createObjectStore('students', {keyPath:'id'});
        s.createIndex('classId','classId',{unique:false});
      }
      if(!db.objectStoreNames.contains('sessions')){
        const s = db.createObjectStore('sessions', {keyPath:'id'});
        s.createIndex('classId','classId',{unique:false});
      }
      if(!db.objectStoreNames.contains('events')){
        const s = db.createObjectStore('events', {keyPath:'id'});
        s.createIndex('sessionId','sessionId',{unique:false});
        s.createIndex('studentId','studentId',{unique:false});
        s.createIndex('classId','classId',{unique:false});
      }
      if(!db.objectStoreNames.contains('directory')){
        const s = db.createObjectStore('directory', {keyPath:'id'});
        s.createIndex('cohort','cohort',{unique:false});
      }
      if(!db.objectStoreNames.contains('writingAssessments')){
        const s = db.createObjectStore('writingAssessments', {keyPath:'id'});
        s.createIndex('classId','classId',{unique:false});
      }
      if(!db.objectStoreNames.contains('writingEvents')){
        const s = db.createObjectStore('writingEvents', {keyPath:'id'});
        s.createIndex('assessmentId','assessmentId',{unique:false});
        s.createIndex('studentId','studentId',{unique:false});
        s.createIndex('classId','classId',{unique:false});
      }
      if(!db.objectStoreNames.contains('writingFeedback')){
        const s = db.createObjectStore('writingFeedback', {keyPath:'id'});
        s.createIndex('assessmentId','assessmentId',{unique:false});
        s.createIndex('studentId','studentId',{unique:false});
      }
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error);
  });
  return openDB._p;
}
async function dbAdd(store, obj){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).add(obj);
    tx.oncomplete = ()=>resolve(obj);
    tx.onerror = (e)=>reject(e.target.error);
  });
}
async function dbPut(store, obj){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = ()=>resolve(obj);
    tx.onerror = (e)=>reject(e.target.error);
  });
}
async function dbGet(store, id){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = (e)=>reject(e.target.error);
  });
}
async function dbGetAll(store){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = (e)=>reject(e.target.error);
  });
}
async function dbGetAllByIndex(store, indexName, value){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).index(indexName).getAll(value);
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = (e)=>reject(e.target.error);
  });
}
async function dbDelete(store, id){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = (e)=>reject(e.target.error);
  });
}

/* ============ SESSION LOGIC ============ */
async function findTodaySession(classId){
  const sessions = await dbGetAllByIndex('sessions','classId', classId);
  const today = todayStr();
  const todays = sessions.filter(s=>s.date===today);
  const open = todays.find(s=>s.status==='open');
  if(open) return open;
  if(todays.length){
    return todays.sort((a,b)=>b.createdAt-a.createdAt)[0];
  }
  return null;
}
async function getOrCreateOpenTodaySession(classId){
  const existing = await findTodaySession(classId);
  if(existing && existing.status==='open') return existing;
  const s = {
    id: uuid(), classId, date: todayStr(), status:'open',
    studentOfClassId:null, studentOfClassReason:null,
    createdAt: Date.now(), closedAt:null
  };
  await dbAdd('sessions', s);
  return s;
}

/* ---- Directory import: one sheet per cohort ---- */
async function importDirectoryFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  let totalStudents = 0;
  let cohortCount = 0;
  const unrecognizedHouses = []; // {sheet, name, rawValue} — non-empty House cell we couldn't match
  for(const sheetName of wb.SheetNames){
    const sheet = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if(rows.length===0) continue;
    cohortCount++;
    for(const rawRow of rows){
      const row = normalizeRow(rawRow);
      const givenName = String(getField(row,'Given Name','First Name')).trim();
      if(!givenName) continue; // only a real name is required
      const familyName = String(getField(row,'Family Name','Last Name','Surname')).trim();
      // Student ID is optional — some teachers don't want ID numbers in the file at all.
      // When it's missing, derive a stable-enough key from the name + cohort so re-imports
      // of the same row still update in place instead of duplicating. The one tradeoff:
      // correcting a name later will be treated as a new student rather than an update,
      // since there's no ID to match on.
      let id = String(getField(row,'Student ID','ID','StudentID','Student Number')).trim();
      if(!id){
        id = 'auto:' + normalizeKey(sheetName) + ':' + normalizeKey(givenName) + ':' + normalizeKey(familyName);
      }
      const rawHouse = getField(row,'House');
      const house = normalizeHouseValue(rawHouse);
      if(String(rawHouse).trim() && !house){
        // Non-empty cell that didn't match any of the 4 house names — flag it rather than
        // silently leaving the student with no house. Common cause: the sheet color-codes
        // house membership with cell fill instead of typing the house name as text, which
        // reads as blank to a program either way — but this at least catches typos/extra words.
        unrecognizedHouses.push({ sheet: sheetName, name: givenName+' '+familyName, rawValue: String(rawHouse).trim() });
      }
      const record = {
        id,
        cohort: sheetName,
        givenName,
        familyName,
        homeroomGroup: String(getField(row,'Homeroom Group','Group')).trim() || null,
        homeroomTeacher: String(getField(row,'Homeroom Teacher','Teacher')).trim() || null,
        house,
        gender: normalizeGenderValue(getField(row,'Gender','Sex')),
        importedAt: Date.now()
      };
      await dbPut('directory', record);
      totalStudents++;
    }
  }
  return { totalStudents, cohortCount, unrecognizedHouses };
}

// Backfills House / Gender / Homeroom Group / Homeroom Teacher on existing roster students
// from the directory, for anyone added via "Add from Directory" (has a directoryId).
// Deliberately fills gaps only -- a field the teacher already set (by hand or from a prior
// import) is left alone, so this can't silently overwrite a manual correction. This matters
// because "Add from Directory" copies house/gender/etc. as a one-time snapshot when the
// student is added -- if the directory file is corrected or filled in LATER, students already
// on a roster don't pick that up automatically. This is the catch-up step for that case.
async function refreshRosterFromDirectory(classId){
  const students = await dbGetAllByIndex('students','classId', classId);
  let updated = 0;
  for(const s of students){
    if(!s.directoryId) continue;
    const rec = await dbGet('directory', s.directoryId);
    if(!rec) continue;
    let changed = false;
    if(!s.house && rec.house){ s.house = rec.house; changed = true; }
    if(!s.gender && rec.gender){ s.gender = rec.gender; changed = true; }
    if(!s.homeroomGroup && rec.homeroomGroup){ s.homeroomGroup = rec.homeroomGroup; changed = true; }
    if(!s.homeroomTeacher && rec.homeroomTeacher){ s.homeroomTeacher = rec.homeroomTeacher; changed = true; }
    if(changed){ await dbPut('students', s); updated++; }
  }
  return updated;
}

function renderDirectoryCohortStep(backdrop, directoryEntries){
  const cohorts = [...new Set(directoryEntries.map(d=>d.cohort))].sort((a,b)=>{
    const ga = gradeForCohort(a), gb = gradeForCohort(b);
    if(ga != null && gb != null) return gb - ga; // highest current grade first
    return a.localeCompare(b);
  });
  const modalEl = backdrop.querySelector('.modal');
  modalEl.innerHTML = `
    <div class="modal-header">
      <h3>Add from Directory</h3>
      <button class="icon-btn" id="close-directory-modal">&times;</button>
    </div>
    <div class="muted" style="margin-bottom:10px;">Choose a cohort</div>
    ${cohorts.map(c=>`<button class="cat-btn" data-cohort="${escapeHtml(c)}">${escapeHtml(cohortDisplayLabel(c))}</button>`).join('')}
  `;
  modalEl.querySelector('#close-directory-modal').addEventListener('click', ()=>backdrop.remove());
  modalEl.querySelectorAll('[data-cohort]').forEach(el=>{
    el.addEventListener('click', ()=>{

    ${availableEntries.length ? '<button class="btn primary block" id="add-selected-directory-btn" style="margin-top:10px;">Add Selected</button>' : ''}
  `;
  modalEl.querySelector('#close-directory-modal2').addEventListener('click', ()=>backdrop.remove());
  modalEl.querySelector('#back-to-cohorts').addEventListener('click', ()=>{

/* ---- Cascade delete: wipes a class and everything under it ---- */
async function deleteClassCascade(classId){
  const students = await dbGetAllByIndex('students','classId', classId);
  for(const s of students) await dbDelete('students', s.id);
  const sessions = await dbGetAllByIndex('sessions','classId', classId);
  for(const s of sessions) await dbDelete('sessions', s.id);
  const events = await dbGetAllByIndex('events','classId', classId);
  for(const e of events) await dbDelete('events', e.id);
  await dbDelete('classes', classId);
}

  const today = todayStr();
  const past = sessions.filter(s=> s.date < today && s.groups && s.groups.length)
    .sort((a,b)=> b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
  return past.length ? past[0] : null;
}

async function renderLogTab(todaySession){
  const students = (await dbGetAllByIndex('students','classId', state.currentClassId))
    .filter(s=>s.active!==false)
    .sort((a,b)=>a.name.localeCompare(b.name));

  let eventCounts = {};
  let answeredIds = new Set();
  if(todaySession){
    const events = await dbGetAllByIndex('events','sessionId', todaySession.id);
    events.forEach(e=>{
      if(e.category==='shares_idea') answeredIds.add(e.studentId);
      if(e.category===NO_ENTRIES_KEY) return;
      eventCounts[e.studentId] = (eventCounts[e.studentId]||0)+1;
    });
  }

  let banner;
  if(!todaySession){
    banner = `<div class="session-banner">
      <div><strong>No session started today.</strong> Tap a student to log something, or submit now if there's nothing to log.</div>
      <button class="btn danger small" id="end-class-btn">Submit Day (Nothing to Log)</button>
    </div>`;
  } else if(todaySession.status==='open'){
    banner = `<div class="session-banner">
      <div><strong>Session open</strong> &middot; ${formatDateNice(todaySession.date)}</div>
      <button class="btn danger small" id="end-class-btn">End Class</button>
    </div>`;
  } else {
    const closedTime = new Date(todaySession.closedAt).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    banner = `<div class="session-banner closed">
      <div><strong>Today's class was already submitted</strong> at ${closedTime}. Tap any student below to log a new, separate session for today (e.g. a second period with this class).</div>
    </div>`;
  }

  // Offer to carry over yesterday's breakout groups, but only before today's session exists
  // (session creation stays tied to the first real tap, same as everywhere else in the app).
  let carryoverBanner = '';
  if(!todaySession && !state.groupCarryoverDismissed){
    const prior = await getMostRecentPastSessionWithGroups(state.currentClassId);
    if(prior){
      carryoverBanner = `<div class="session-banner">
        <div><strong>Last class was in breakout groups</strong> (${prior.groups.length} groups). Continue today in the same groups, or start normal?</div>
        <div class="row">
          <button class="btn small primary" id="carryover-continue-btn">Continue in Groups</button>
          <button class="btn small ghost" id="carryover-normal-btn">Start Normal</button>
        </div>
      </div>`;
    }
  }

  const unansweredCount = students.filter(s=>!answeredIds.has(s.id)).length;
  const groups = todaySession && todaySession.groups && todaySession.groups.length ? todaySession.groups : null;
  const toolsRow = `<div class="row wrap" style="margin-bottom:4px;">
    <button class="btn small" id="pick-random-btn">Pick a Student</button>
    <button class="btn small" id="create-groups-btn">${groups ? 'Regenerate Break Out Groups' : 'Create Break Out Groups'}</button>
    ${groups ? `<button class="btn small ghost" id="reset-groups-btn">Reset to Normal View</button>` : ''}
  </div>
  <div class="muted" style="margin-bottom:12px; font-size:12px;">
    Prioritizes students who haven't answered yet today (green check = already answered) &mdash; picks from the whole class once everyone has.
    ${todaySession ? ` Right now: ${unansweredCount} of ${students.length} haven't answered.` : ''}
  </div>`;

  if(students.length===0){
    return banner + carryoverBanner + `<div class="empty">No active students in this class. Add students from Edit Roster.</div>`;
  }

  if(!groups){
    return `${banner}${carryoverBanner}${toolsRow}${studentGridHtml(students, eventCounts, answeredIds)}`;
  }

  const byId = {}; students.forEach(s=> byId[s.id]=s);
  const groupedIds = new Set();
  const groupBlocks = groups.map(g=>{
    const groupStudents = g.studentIds.map(id=>byId[id]).filter(Boolean);
    groupStudents.forEach(s=> groupedIds.add(s.id));
    return `<h4 style="margin-top:18px;">${escapeHtml(g.label)} <span class="muted" style="font-weight:400;">(${groupStudents.length})</span></h4>
      ${studentGridHtml(groupStudents, eventCounts, answeredIds)}`;
  }).join('');
  const ungrouped = students.filter(s=>!groupedIds.has(s.id));
  const ungroupedBlock = ungrouped.length
    ? `<h4 style="margin-top:18px;">Ungrouped <span class="muted" style="font-weight:400;">(${ungrouped.length})</span></h4>${studentGridHtml(ungrouped, eventCounts, answeredIds)}`
    : '';

  return `${banner}${carryoverBanner}${toolsRow}${groupBlocks}${ungroupedBlock}`;
}

        </div>

            <span class="chip ${houseMode==='aligned'?'selected':''}" data-house="aligned">House Aligned</span>

          </div>
        </div>
        <div class="muted" style="margin-bottom:12px;">Students marked absent today are left out of the groups.</div>
        <button class="btn primary block" id="generate-groups-btn">Generate Groups</button>
      </div>
    `;
    backdrop.querySelector('#close-groups-modal').addEventListener('click', ()=>backdrop.remove());
    backdrop.querySelectorAll('[data-size]').forEach(el=>{
      el.addEventListener('click', ()=>{ groupSize = parseInt(el.getAttribute('data-size'),10); renderModal(); });
    });
    backdrop.querySelectorAll('[data-gender]').forEach(el=>{
      el.addEventListener('click', ()=>{ genderMode = el.getAttribute('data-gender'); renderModal(); });
    });
    backdrop.querySelectorAll('[data-house]').forEach(el=>{
      el.addEventListener('click', ()=>{ houseMode = el.getAttribute('data-house'); renderModal(); });
    });
    backdrop.querySelector('#generate-groups-btn').addEventListener('click', async ()=>{
      const session = await getOrCreateOpenTodaySession(state.currentClassId);
      const allActive = (await dbGetAllByIndex('students','classId', state.currentClassId))
        .filter(s=>s.active!==false);
      const events = await dbGetAllByIndex('events','sessionId', session.id);
      const absentIds = new Set(events.filter(e=>e.category==='absent').map(e=>e.studentId));
      const eligible = allActive.filter(s=>!absentIds.has(s.id));
      if(eligible.length===0){ toast('No eligible students to group (everyone active is marked absent)'); return; }
      session.groups = buildBreakoutGroups(eligible, groupSize, genderMode, houseMode);

      toast(`Created ${session.groups.length} groups`, 'good');
      backdrop.remove();
      render();
    });
  };
  renderModal();
  document.body.appendChild(backdrop);
}

/* ---- Random picker: unanswered students first, whole class once everyone has answered ---- */
async function handlePickRandomStudent(){
  const allActive = (await dbGetAllByIndex('students','classId', state.currentClassId))
    .filter(s=>s.active!==false);
  const todaySession = await findTodaySession(state.currentClassId);
  const answeredIds = new Set();
  const absentIds = new Set();
  if(todaySession){
    const events = await dbGetAllByIndex('events','sessionId', todaySession.id);
    events.forEach(e=>{
      if(e.category==='shares_idea') answeredIds.add(e.studentId);
      if(e.category==='absent') absentIds.add(e.studentId);
    });
  }
  // Absent students aren't eligible to be called on at all, not just "already answered".
  const students = allActive.filter(s=>!absentIds.has(s.id));
  if(students.length===0){ toast('No students available to pick from (everyone active is marked absent)'); return; }
  const unanswered = students.filter(s=>!answeredIds.has(s.id));
  const pool = unanswered.length > 0 ? unanswered : students;
  const picked = pool[Math.floor(Math.random()*pool.length)];
  // Remember who was just called on so the next Shares Idea from THEM specifically
  // can be auto-tagged as "called on" rather than volunteered — no extra tap needed.
  state.lastPickedStudentId = picked.id;
  state.lastPickedAt = Date.now();
  const msg = unanswered.length > 0
    ? `Picked: ${picked.name} (${pool.length} of ${students.length} haven't answered yet)`
    : `Picked: ${picked.name} (everyone has answered — picked from full class of ${students.length})`;
  toast(msg, 'good');
}

/* ---- Event logging modal ---- */
function openEventModal(student, categoryKey){
  const category = categoryKey ? TAXONOMY.find(t=>t.key===categoryKey) : null;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'event-modal-backdrop';

  let bodyHtml;
  if(!category){
    bodyHtml = TAXONOMY.map(t=>`
      <button class="cat-btn" data-cat="${t.key}">
        ${escapeHtml(t.label)}
        <span class="tag ${t.polarity}">${t.polarity}</span>
      </button>
    `).join('');
  } else {
    bodyHtml = category.subtypes.map(st=>`
      <button class="cat-btn" data-sub="${st.key}">${escapeHtml(st.label)}</button>
    `).join('') + `<button class="btn ghost" id="back-to-cats">&larr; Back</button>`;
  }

  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>${escapeHtml(student.name)}${category?(' &mdash; '+escapeHtml(category.label)):''}</h3>
        <button class="icon-btn" id="close-event-modal">&times;</button>
      </div>
      ${bodyHtml}
    </div>
  `;
  document.body.appendChild(backdrop);

  document.getElementById('close-event-modal').addEventListener('click', ()=>backdrop.remove());
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) backdrop.remove(); });

  if(!category){
    backdrop.querySelectorAll('[data-cat]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const key = el.getAttribute('data-cat');
        const cat = TAXONOMY.find(t=>t.key===key);
        backdrop.remove();
        if(cat.subtypes){
          openEventModal(student, key);
        } else {
          logEvent(student, key, null);
        }
      });
    });
  } else {
    backdrop.querySelectorAll('[data-sub]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const subKey = el.getAttribute('data-sub');
        backdrop.remove();
        logEvent(student, category.key, subKey);
      });
    });
    document.getElementById('back-to-cats').addEventListener('click', ()=>{
      backdrop.remove();
      openEventModal(student, null);
    });
  }
}

async function logEvent(student, categoryKey, subKey, amount){
  amount = amount || 1;
  const session = await getOrCreateOpenTodaySession(state.currentClassId);
  const ev = {
    id: uuid(), sessionId: session.id, classId: state.currentClassId, studentId: student.id,
    category: categoryKey, subtype: subKey || null, note:null, amount, timestamp: Date.now()
  };

  // Called-on vs volunteered: if this student was the most recent "Pick a Student" result
  // and we're still inside the answer window, tag this event as a called-on response.
  const wasJustPicked = state.lastPickedStudentId === student.id
    && state.lastPickedAt
    && (Date.now() - state.lastPickedAt) < CALLED_ON_WINDOW_MS;
  if(wasJustPicked){
    if(categoryKey === 'shares_idea'){
      ev.viaRandomPick = true;
    }
    // Whether they answered or something else got logged for them, the "just picked"
    // moment is over — clear it so it doesn't attach to some unrelated event later.
    state.lastPickedStudentId = null;
    state.lastPickedAt = null;
  }

  await dbAdd('events', ev);
  toast(`${student.name}: ${rowLabel(categoryKey, subKey)}${ev.viaRandomPick ? ' (called on)' : ''}`, 'good');

  const cat = TAXONOMY.find(t=>t.key===categoryKey);
  if(cat && cat.polarity === 'negative'){
    await checkNegativePatternAlert(student, categoryKey, subKey);
  }

  render();
}

// Warn the teacher when a student hits a multiple of 3 for the SAME issue (all-time, this class).
async function checkNegativePatternAlert(student, categoryKey, subKey){
  const events = await dbGetAllByIndex('events','studentId', student.id);
  const count = events.filter(e => e.category === categoryKey && (e.subtype || null) === (subKey || null)).length;
  if(count > 0 && count % 3 === 0){
    window.alert(`Heads up: ${student.name} now has ${count} "${rowLabel(categoryKey, subKey)}" entries. Might be worth addressing.`);
  }
}

/* ---- End of Class flow ---- */
async function openEndOfClassModal(){
  let session = await findTodaySession(state.currentClassId);
  if(session && session.status==='closed'){ toast('Today has already been submitted'); return; }
  if(!session){
    session = await getOrCreateOpenTodaySession(state.currentClassId);
  }

  const students = (await dbGetAllByIndex('students','classId', state.currentClassId))
    .filter(s=>s.active!==false).sort((a,b)=>a.name.localeCompare(b.name));

  const allSessions = (await dbGetAllByIndex('sessions','classId', state.currentClassId))
    .filter(s=>s.status==='closed' && s.studentOfClassId)
    .sort((a,b)=>b.closedAt - a.closedAt);

  const winInfo = {};
  students.forEach(s=>{
    const idx = allSessions.findIndex(sess=>sess.studentOfClassId===s.id);
    winInfo[s.id] = idx === -1 ? {never:true} : {sessionsAgo: idx};
  });

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'eoc-modal-backdrop';

  const studentOptionsHtml = students.map(s=>{
    const w = winInfo[s.id];
    const badge = w.never
      ? `<span class="badge-never">never picked</span>`
      : (w.sessionsAgo===0 ? `<span class="badge-recent">picked last time</span>` : `<span class="badge-recent">${w.sessionsAgo} sessions ago</span>`);
    return `
      <button class="cat-btn" data-pick-student="${s.id}" style="display:flex; align-items:center; justify-content:space-between;">
        <span>${escapeHtml(s.name)}</span>
        ${badge}
      </button>`;
  }).join('');

  backdrop.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <h3>End of Class</h3>
        <button class="icon-btn" id="close-eoc-modal">&times;</button>
      </div>
      <div id="eoc-step-pick">
        <div class="muted" style="margin-bottom:10px;">Pick today's Student of the Class. Students who haven't been picked recently are worth a second look.</div>
        ${studentOptionsHtml}
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  document.getElementById('close-eoc-modal').addEventListener('click', ()=>backdrop.remove());

  backdrop.querySelectorAll('[data-pick-student]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const studentId = el.getAttribute('data-pick-student');
      const student = students.find(s=>s.id===studentId);
      renderEocReasonStep(backdrop, session, students, student);
    });
  });
}

function renderEocReasonStep(backdrop, session, students, student){
  const stepEl = backdrop.querySelector('.modal');
  stepEl.innerHTML = `
    <div class="modal-header">
      <h3>Why ${escapeHtml(student.name)}?</h3>
      <button class="icon-btn" id="close-eoc-modal2">&times;</button>
    </div>
    <div class="field">
      <label>Quick tags (optional)</label>
      <div id="reason-tags">${REASON_TAGS.map(t=>`<span class="chip" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('')}</div>
    </div>
    <div class="field">
      <label>Add your own note (optional)</label>
      <textarea id="reason-text" placeholder="What did they do?"></textarea>
    </div>
    <button class="btn primary block" id="confirm-eoc-btn">Confirm &amp; Submit Class</button>
  `;
  backdrop.querySelector('#close-eoc-modal2').addEventListener('click', ()=>backdrop.remove());

  let selectedTag = null;
  stepEl.querySelectorAll('[data-tag]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const tag = chip.getAttribute('data-tag');
      if(selectedTag===tag){
        selectedTag = null; chip.classList.remove('selected');
      } else {
        stepEl.querySelectorAll('[data-tag]').forEach(c=>c.classList.remove('selected'));
        selectedTag = tag; chip.classList.add('selected');
      }
    });
  });

  stepEl.querySelector('#confirm-eoc-btn').addEventListener('click', async ()=>{
    const freeText = stepEl.querySelector('#reason-text').value.trim();
    const reason = [selectedTag, freeText].filter(Boolean).join(' — ');
    await finalizeSession(session, students, student.id, reason);
    backdrop.remove();
  });
}

async function finalizeSession(session, students, studentOfClassId, reason){
  const events = await dbGetAllByIndex('events','sessionId', session.id);
  const touchedIds = new Set(events.map(e=>e.studentId));
  for(const s of students){
    if(!touchedIds.has(s.id)){
      await dbAdd('events', {
        id: uuid(), sessionId: session.id, classId: state.currentClassId, studentId: s.id,
        category: NO_ENTRIES_KEY, subtype:null, note:null, amount:1, timestamp: Date.now()
      });
    }
  }
  await dbAdd('events', {
    id: uuid(), sessionId: session.id, classId: state.currentClassId, studentId: studentOfClassId,
    category: STUDENT_OF_CLASS_KEY, subtype:null, note: reason || null, amount:1, timestamp: Date.now()
  });
  session.status = 'closed';
  session.studentOfClassId = studentOfClassId;
  session.studentOfClassReason = reason || null;
  session.closedAt = Date.now();
  await dbPut('sessions', session);

  toast('Class submitted. Exporting backup...', 'good');
  await exportClassToExcel(state.currentClassId, {silent:false});
  render();
}

function allRowKeys(){
  const rows = [];
  TAXONOMY.forEach(t=>{
    if(t.subtypes){
      t.subtypes.forEach(st=> rows.push({category:t.key, subtype:st.key, label: rowLabel(t.key, st.key)}));
    } else {
      rows.push({category:t.key, subtype:null, label: rowLabel(t.key, null)});
    }
  });
  rows.push({category:STUDENT_OF_CLASS_KEY, subtype:null, label:'Student of the Class'});
  rows.push({category:NO_ENTRIES_KEY, subtype:null, label:'No Entries Logged'});
  return rows;
}

async function renderStudentPivot(studentId){
  const student = await dbGet('students', studentId);
  const events = await dbGetAllByIndex('events','studentId', studentId);
  if(events.length===0) return `<div class="empty">No data logged yet for this student.</div>`;

  const house = houseByKey(student ? student.house : null);
  const balance = computeBalance(events);
  const balanceBlock = `
    <div class="card">
      <div class="row">
        ${house ? `<span class="house-dot" style="background:${house.color};"></span>` : ''}
        <strong>Positive vs Negative Balance</strong>
      </div>
      <div style="margin-top:8px;">${renderBalanceBar(balance.pos, balance.neg, 260)}</div>
    </div>`;

  const sessions = await dbGetAllByIndex('sessions','classId', state.currentClassId);
  const sessionDateById = {}; sessions.forEach(s=> sessionDateById[s.id]=s.date);
  const dates = [...new Set(events.map(e=>sessionDateById[e.sessionId]).filter(Boolean))].sort();

  const rows = allRowKeys();
  const counts = {};
  rows.forEach(r=> counts[r.category+'|'+r.subtype] = {});
  events.forEach(e=>{
    const date = sessionDateById[e.sessionId];
    if(!date) return;
    const k = e.category+'|'+e.subtype;
    if(!(k in counts)) counts[k] = {};
    counts[k][date] = (counts[k][date]||0) + (e.amount||1);
  });

  const usedRows = rows.filter(r=>{
    const k = r.category+'|'+r.subtype;
    return counts[k] && Object.values(counts[k]).some(v=>v>0);
  });

  let theadCols = dates.map(d=>`<th>${formatDateNice(d)}</th>`).join('');
  let tbodyRows = usedRows.map(r=>{
    const k = r.category+'|'+r.subtype;
    const cells = dates.map(d=>`<td>${counts[k][d]||''}</td>`).join('');
    return `<tr><td class="rowlabel">${escapeHtml(r.label)}</td>${cells}</tr>`;
  }).join('');

  const tableHtml = `<div class="scroll-x"><table class="pivot">
    <thead><tr><th class="rowlabel">Category</th>${theadCols}</tr></thead>
    <tbody>${tbodyRows}</tbody>
  </table></div>`;

  return balanceBlock + tableHtml;
}

/* ============ WEEKLY REPORT ============ */
// Picks the negative category with the highest combined (this week + last week) count,
// tie-broken by this week's count, then alphabetically by label.
function pickDominantCategory(combinedByCategory, thisWeekByCategory){
  let bestKey = null;
  Object.keys(combinedByCategory).forEach(k=>{
    if(!bestKey){ bestKey = k; return; }
    const cur = combinedByCategory[k], best = combinedByCategory[bestKey];
    if(cur > best){ bestKey = k; return; }
    if(cur === best){
      const curThis = thisWeekByCategory[k]||0, bestThis = thisWeekByCategory[bestKey]||0;
      if(curThis > bestThis){ bestKey = k; return; }
      if(curThis === bestThis && catLabel(k) < catLabel(bestKey)) bestKey = k;
    }
  });
  return bestKey;
}

async function computeWeeklyReport(classId, start, end){
  const prevStart = addDaysToDateStr(start, -7);
  const prevEnd = addDaysToDateStr(start, -1);

  const [students, sessions, events] = await Promise.all([
    dbGetAllByIndex('students','classId', classId),
    dbGetAllByIndex('sessions','classId', classId),
    dbGetAllByIndex('events','classId', classId)
  ]);
  const activeStudents = students.filter(s=>s.active!==false);
  const sessionById = {}; sessions.forEach(s=> sessionById[s.id]=s);
  const inRange = (dateStr, a, b) => dateStr >= a && dateStr <= b;

  const perStudent = {};
  activeStudents.forEach(s=>{
    perStudent[s.id] = {
      student: s,
      thisWeekNegByCategory:{}, thisWeekNegTotal:0,
      prevWeekNegByCategory:{}, prevWeekNegTotal:0,
      thisWeekSharesIdeaCount:0, thisWeekSharesIdeaScore:0
    };
  });

  const negativeKeys = new Set(TAXONOMY.filter(t=>t.polarity==='negative').map(t=>t.key));

  events.forEach(e=>{
    const sess = sessionById[e.sessionId];
    if(!sess) return;
    const rec = perStudent[e.studentId];
    if(!rec) return; // student no longer on the active roster
    if(inRange(sess.date, start, end)){
      if(negativeKeys.has(e.category)){
        rec.thisWeekNegByCategory[e.category] = (rec.thisWeekNegByCategory[e.category]||0)+1;
        rec.thisWeekNegTotal++;
      }
      if(e.category==='shares_idea'){
        rec.thisWeekSharesIdeaCount++;
        rec.thisWeekSharesIdeaScore += eventSignedValue(e);
      }
    } else if(inRange(sess.date, prevStart, prevEnd)){
      if(negativeKeys.has(e.category)){
        rec.prevWeekNegByCategory[e.category] = (rec.prevWeekNegByCategory[e.category]||0)+1;
        rec.prevWeekNegTotal++;
      }
    }
  });

  // Top 3 Performers: clean behavior this week AND actually participated (silence doesn't count as good).
  const performers = Object.values(perStudent)
    .filter(r=> r.thisWeekNegTotal===0 && r.thisWeekSharesIdeaCount>0)
    .sort((a,b)=> b.thisWeekSharesIdeaScore - a.thisWeekSharesIdeaScore
                || b.thisWeekSharesIdeaCount - a.thisWeekSharesIdeaCount
                || a.student.name.localeCompare(b.student.name))
    .slice(0,3);

  // 3 Students to Watch: ranked on a 2-week combined total so a sustained/building issue outranks a one-off.
  const watch = Object.values(perStudent)
    .map(r=>{
      const combinedByCategory = {};
      Object.keys(r.thisWeekNegByCategory).forEach(k=> combinedByCategory[k]=(combinedByCategory[k]||0)+r.thisWeekNegByCategory[k]);
      Object.keys(r.prevWeekNegByCategory).forEach(k=> combinedByCategory[k]=(combinedByCategory[k]||0)+r.prevWeekNegByCategory[k]);
      const dominantKey = pickDominantCategory(combinedByCategory, r.thisWeekNegByCategory);
      const dominantThisWeek = dominantKey ? (r.thisWeekNegByCategory[dominantKey]||0) : 0;
      const dominantPrevWeek = dominantKey ? (r.prevWeekNegByCategory[dominantKey]||0) : 0;
      return {
        student: r.student,
        combinedTotal: r.thisWeekNegTotal + r.prevWeekNegTotal,
        thisWeekNegTotal: r.thisWeekNegTotal,
        dominantKey, dominantThisWeek, dominantPrevWeek,
        hasOtherIssues: (r.thisWeekNegTotal + r.prevWeekNegTotal) > (dominantThisWeek + dominantPrevWeek)
      };
    })
    .filter(r=> r.combinedTotal>0)
    .sort((a,b)=> b.combinedTotal - a.combinedTotal
                || b.thisWeekNegTotal - a.thisWeekNegTotal
                || a.student.name.localeCompare(b.student.name))
    .slice(0,3);

  // Student of the Class picks logged this week
  const sotcPicks = sessions
    .filter(s=> inRange(s.date, start, end) && s.studentOfClassId)
    .sort((a,b)=> a.date.localeCompare(b.date))
    .map(s=>{
      const rec = perStudent[s.studentOfClassId];
      const student = rec ? rec.student : students.find(x=>x.id===s.studentOfClassId);
      return { date: s.date, studentName: student ? student.name : '(removed student)' };
    });

  return { start, end, performers, watch, sotcPicks };
}
